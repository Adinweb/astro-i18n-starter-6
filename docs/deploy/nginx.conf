# Production Nginx configuration for Astro SSG (`dist/`)
# Handles custom localized 404 routes cleanly alongside immutable `/_astro/` assets.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    root /var/www/site/dist;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Long-term immutable cache for fingerprinted Astro assets
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Moderate cache for generated Pagefind index and OG images
    location ~* ^/(pagefind|og)/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Custom localized 404 fallback
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Static directory routing
    location / {
        try_files $uri $uri/ =404;
    }
}
