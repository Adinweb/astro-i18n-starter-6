name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, build & smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SITE_URL: https://example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (messages, astro check, tsc)
        run: pnpm run lint

      - name: Unit tests
        run: pnpm test

      - name: i18n audit
        run: pnpm run audit:i18n

      - name: Build (Astro + Pagefind)
        run: pnpm run build

      - name: Smoke test built output
        run: pnpm run smoke

      - name: Dead code check
        run: pnpm run knip

      - name: CLI workflow check
        run: pnpm run verify:cli
