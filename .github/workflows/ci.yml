name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, build & smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SITE_URL: https://example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Security audit
        run: bun audit

      - name: Lint (messages, astro check, tsc)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: i18n audit
        run: npm run audit:i18n

      - name: Upstream contract check
        run: npm run upstream:check

      - name: Project health (doctor)
        run: npm run doctor

      - name: Build (Astro + Pagefind)
        run: npm run build

      - name: Smoke test built output
        run: npm run smoke

      - name: Internal link crawl
        run: npm run link:check

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Browser layout, CLS, JS budget & accessibility QA
        run: npm run qa:browser

      - name: Lighthouse performance, accessibility & SEO audit
        run: npm run qa:lighthouse

      - name: Dead code check
        run: npm run knip

      - name: CLI workflow check
        run: npm run verify:cli

