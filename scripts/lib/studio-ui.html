    function render() {
      const c = t();
      const navHtml = Object.entries(c.tabs).map(([k, lbl]) =>
        `<button type="button" class="tab-btn ${activeTab === k ? 'active' : ''}" data-tab="${esc(k)}">${esc(lbl)}</button>`
      ).join('');
      document.getElementById('tabs-nav').innerHTML = navHtml;

      const root = document.getElementById('tab-content');
      if (!state) {
        root.innerHTML = '<div class="card">Loading Studio state...</div>';
        return;
      }
      if (activeTab === 'wizard') root.innerHTML = renderWizardTab();
      else if (activeTab === 'config') root.innerHTML = renderConfigTab();
      else if (activeTab === 'cms') root.innerHTML = renderCmsTab();
      else if (activeTab === 'content') root.innerHTML = renderContentTab();
      else if (activeTab === 'i18n') root.innerHTML = renderI18nTab();
      else root.innerHTML = renderToolsTab();
    }

    // ---------- Event Delegation ----------
    function resolveSectionArray(scope) {
      if (scope === 'wizard') return wizardDraft.homeSections;
      if (scope === 'config') {
        configDraft.ui.homeSections = configDraft.ui.homeSections || [];
        return configDraft.ui.homeSections;
      }
      return modalState?.data?.sections;
    }

    document.getElementById('tabs-nav').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-tab]');
      if (!btn) return;
      activeTab = btn.dataset.tab;
      localStorage.setItem('studio_tab', activeTab);
      render();
    });

    document.getElementById('ui-missing-badge').addEventListener('click', () => {
      activeTab = 'i18n';
      i18nFilterStatus = 'todo';
      localStorage.setItem('studio_tab', activeTab);
      render();
    });

    document.getElementById('ui-cms-sync-badge').addEventListener('click', () => {
      activeTab = 'cms';
      localStorage.setItem('studio_tab', activeTab);
      render();
    });

    document.getElementById('btn-refresh').addEventListener('click', () => {
      refreshState({ resetDrafts: true }).then(() => showToast(L('به‌روزرسانی شد', 'Refreshed')));
    });

    document.getElementById('btn-lang').addEventListener('click', () => {
      uiLang = uiLang === 'fa' ? 'en' : 'fa';
      localStorage.setItem('studio_lang', uiLang);
      updateChrome();
      render();
    });

    document.getElementById('btn-theme').addEventListener('click', () => {
      const cur = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = cur;
      localStorage.setItem('studio_theme', cur);
    });

    document.getElementById('console-toggle').addEventListener('click', (e) => {
      if (e.target.closest('#console-clear')) return;
      const body = document.getElementById('console-body');
      setConsoleOpen(body.classList.contains('hidden'));
    });

    document.getElementById('console-clear').addEventListener('click', () => {
      document.getElementById('console-pre').textContent = '';
      document.getElementById('console-status').textContent = t().ready;
      document.getElementById('console-status').className = 'badge';
      setConsoleOpen(false);
    });

    function syncScalarField(el, isChange = false) {
      if (el.dataset.pm) {
        setPath(projectDraft, el.dataset.pm, el.value);
      } else if (el.dataset.wiz) {
        setPath(wizardDraft, el.dataset.wiz, el.value);
        if (el.dataset.wiz === 'brand.preset' && isChange) render();
      } else if (el.dataset.wizColor) {
        setPath(wizardDraft, el.dataset.wizColor, el.value);
        const paired = document.querySelector(`[data-wiz="${el.dataset.wizColor}"]`);
        if (paired) paired.value = el.value;
      } else if (el.dataset.cfg) {
        setPath(configDraft, el.dataset.cfg, el.value);
        if (el.dataset.cfg === 'brand.preset' && isChange) render();
        else if (el.dataset.cfg.startsWith('brand.')) {
          const colInp = document.querySelector(`[data-cfg-color="${el.dataset.cfg}"]`);
          if (colInp && /^#[0-9a-fA-F]{6}$/.test(el.value)) colInp.value = el.value;
        }
      } else if (el.dataset.cfgColor) {
        setPath(configDraft, el.dataset.cfgColor, el.value);
        const paired = document.querySelector(`[data-cfg="${el.dataset.cfgColor}"]`);
        if (paired) paired.value = el.value;
      } else if (el.dataset.cfgNum) {
        setPath(configDraft, el.dataset.cfgNum, el.value === '' ? '' : Number(el.value));
      } else if (el.dataset.cfgNumOpt) {
        setPath(configDraft, el.dataset.cfgNumOpt, el.value === '' ? '' : Number(el.value));
      } else if (el.dataset.cfgList) {
        setPath(configDraft, el.dataset.cfgList, el.value.split(',').map((s) => s.trim()).filter(Boolean));
      } else if (el.dataset.cfgJson) {
        try {
          const parsed = JSON.parse(el.value);
          if (Array.isArray(parsed)) {
            setPath(configDraft, el.dataset.cfgJson, parsed);
            delete el.dataset.jsonInvalid;
            el.style.borderColor = '';
          } else {
            el.dataset.jsonInvalid = '1';
            el.style.borderColor = 'var(--danger)';
          }
        } catch {
          el.dataset.jsonInvalid = '1';
          el.style.borderColor = 'var(--danger)';
        }
      } else if (el.dataset.cms) {
        setPath(cmsDraft, el.dataset.cms, el.value);
      } else if (el.dataset.cmsNum) {
        setPath(cmsDraft, el.dataset.cmsNum, el.value === '' ? '' : Number(el.value));
      } else if (el.dataset.cmsNumOpt) {
        setPath(cmsDraft, el.dataset.cmsNumOpt, el.value === '' ? '' : Number(el.value));
      } else if (el.dataset.cmsOptbool) {
        const parts = el.dataset.cmsOptbool.split('.');
        const leaf = parts.pop();
        let parent = cmsDraft;
        for (const p of parts) {
          if (!parent[p] || typeof parent[p] !== 'object') parent[p] = {};
          parent = parent[p];
        }
        if (el.value === '') delete parent[leaf];
        else parent[leaf] = el.value === 'true';
      } else if (el.dataset.secProp) {
        const [scope, idxStr, prop] = el.dataset.secProp.split(':');
        const arr = resolveSectionArray(scope);
        const sec = arr?.[Number(idxStr)];
        if (sec) {
          sec.props = sec.props || {};
          if (el.value === '') delete sec.props[prop];
          else sec.props[prop] = el.value;
          const jsonTa = document.querySelector(`[data-sec-json="${scope}:${idxStr}"]`);
          if (jsonTa) {
            jsonTa.value = JSON.stringify(sec.props, null, 2);
            delete jsonTa.dataset.jsonInvalid;
            jsonTa.style.borderColor = '';
          }
          const cnt = document.querySelector(`[data-sec-count="${scope}:${idxStr}"]`);
          if (cnt) cnt.textContent = String(Object.keys(sec.props).length);
        }
      } else if (el.dataset.secJson) {
        const [scope, idxStr] = el.dataset.secJson.split(':');
        const arr = resolveSectionArray(scope);
        const sec = arr?.[Number(idxStr)];
        if (sec) {
          try {
            const parsed = JSON.parse(el.value);
            if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
              sec.props = parsed;
              delete el.dataset.jsonInvalid;
              el.style.borderColor = '';
              const cnt = document.querySelector(`[data-sec-count="${scope}:${idxStr}"]`);
              if (cnt) cnt.textContent = String(Object.keys(parsed).length);
              document.querySelectorAll(`[data-sec-prop^="${scope}:${idxStr}:"]`).forEach((inp) => {
                const prop = inp.dataset.secProp.split(':')[2];
                inp.value = parsed[prop] ?? '';
              });
            } else {
              el.dataset.jsonInvalid = '1';
              el.style.borderColor = 'var(--danger)';
            }
          } catch {
            el.dataset.jsonInvalid = '1';
            el.style.borderColor = 'var(--danger)';
          }
        }
      } else if (el.dataset.msgCell) {
        const [loc, key] = el.dataset.msgCell.split('|');
        msgDirty[loc] = msgDirty[loc] || {};
        if (el.dataset.msgArray === '1') {
          try {
            const parsed = JSON.parse(el.value);
            if (Array.isArray(parsed)) {
              msgDirty[loc][key] = parsed;
              delete el.dataset.jsonInvalid;
              el.style.borderColor = 'var(--primary)';
            } else {
              el.dataset.jsonInvalid = '1';
              el.style.borderColor = 'var(--danger)';
            }
          } catch {
            el.dataset.jsonInvalid = '1';
            el.style.borderColor = 'var(--danger)';
          }
        } else {
          msgDirty[loc][key] = el.value;
          el.style.borderColor = 'var(--primary)';
        }
      } else if (modalState?.type === 'entry') {
        const fm = modalState.data.frontmatter;
        if (el.dataset.efm) fm[el.dataset.efm] = el.value;
        else if (el.dataset.efmNum) fm[el.dataset.efmNum] = el.value === '' ? undefined : Number(el.value);
        else if (el.dataset.efmList) fm[el.dataset.efmList] = el.value.split(',').map((s) => s.trim()).filter(Boolean);
        else if (el.dataset.efmCustom) fm[el.dataset.efmCustom] = el.value;
        else if (el.dataset.efmCustomNum) fm[el.dataset.efmCustomNum] = el.value === '' ? undefined : Number(el.value);
        else if (el.dataset.efmCustomList) fm[el.dataset.efmCustomList] = el.value.split(',').map((s) => s.trim()).filter(Boolean);
        else if (el.dataset.entryBody) modalState.data.body = el.value;
      } else if (modalState?.type === 'sections') {
        if (el.dataset.psec) modalState.data[el.dataset.psec] = el.value;
      } else if (modalState?.type === 'contentType') {
        const ct = modalState.data;
        if (el.dataset.ct) ct[el.dataset.ct] = el.value;
        else if (el.dataset.ctNum) ct[el.dataset.ctNum] = el.value === '' ? '' : Number(el.value);
        else if (el.dataset.ctMap) {
          const [mapName, loc] = el.dataset.ctMap.split(':');
          ct[mapName] = ct[mapName] || {};
          ct[mapName][loc] = el.value;
        } else if (el.dataset.ctCard) {
          ct.card = ct.card || {};
          ct.card[el.dataset.ctCard] = el.value;
        } else if (el.dataset.ctCardNum) {
          ct.card = ct.card || {};
          ct.card[el.dataset.ctCardNum] = el.value === '' ? '' : Number(el.value);
        } else if (el.dataset.ctCardList) {
          ct.card = ct.card || {};
          ct.card[el.dataset.ctCardList] = el.value.split(',').map((s) => s.trim()).filter(Boolean);
        } else if (el.dataset.ctSearchFields) {
          ct.search = ct.search || { enabled: true };
          ct.search.fields = el.value.split(',').map((s) => s.trim()).filter(Boolean);
        } else if (el.dataset.ctSearchPh) {
          ct.search = ct.search || { enabled: true };
          ct.search.placeholder = ct.search.placeholder || {};
          ct.search.placeholder[el.dataset.ctSearchPh] = el.value;
        } else if (el.dataset.ctf) {
          const [fiStr, prop] = el.dataset.ctf.split(':');
          const fi = Number(fiStr);
          if (prop === 'showOnCard') {
            ct.fields[fi].showOnCard = el.value === '' ? undefined : el.value === 'true' ? true : el.value === 'false' ? false : el.value;
          } else if (prop === 'default' && ct.fields[fi].type === 'boolean') {
            ct.fields[fi].default = el.value === '' ? undefined : el.value === 'true';
          } else {
            ct.fields[fi][prop] = el.value;
            if (isChange && prop === 'type') renderModal();
          }
        } else if (el.dataset.ctfNum) {
          const [fiStr, prop] = el.dataset.ctfNum.split(':');
          ct.fields[Number(fiStr)][prop] = el.value === '' ? undefined : Number(el.value);
        } else if (el.dataset.ctfOpts) {
          ct.fields[Number(el.dataset.ctfOpts)].options = el.value.split(',').map((s) => s.trim()).filter(Boolean);
        } else if (el.dataset.ctfFilter) {
          const [fi, prop] = el.dataset.ctfFilter.split(':');
          ct.fields[Number(fi)].filter = ct.fields[Number(fi)].filter || { enabled: true, mode: 'multi' };
          ct.fields[Number(fi)].filter[prop] = el.value;
        } else if (el.dataset.ctfFilterMap) {
          const [fi, mapKey, loc] = el.dataset.ctfFilterMap.split(':');
          const f = ct.fields[Number(fi)];
          f.filter = f.filter || { enabled: true, mode: 'multi' };
          f.filter[mapKey] = f.filter[mapKey] || {};
          f.filter[mapKey][loc] = el.value;
        }
      } else if (modalState?.type === 'localeMeta') {
        if (el.dataset.lm) modalState.data[el.dataset.lm] = el.value;
      }
    }

    document.addEventListener('input', (e) => {
      const el = e.target;
      if (el.type === 'checkbox' || el.type === 'file') return;
      if (el.id === 'i18n-search') {
        i18nSearch = el.value;
        i18nPage = 0;
        const pos = el.selectionStart;
        render();
        const nextInput = document.getElementById('i18n-search');
        if (nextInput) {
          nextInput.focus();
          nextInput.setSelectionRange(pos, pos);
        }
        return;
      }
      if (el.id === 'content-search') {
        contentSearch = el.value;
        const pos = el.selectionStart;
        render();
        const nextInput = document.getElementById('content-search');
        if (nextInput) {
          nextInput.focus();
          nextInput.setSelectionRange(pos, pos);
        }
        return;
      }
      if (el.id === 'add-lang-code') {
        const dirEl = document.getElementById('add-lang-dir');
        if (dirEl && dirEl.dataset.dirTouched !== '1') {
          dirEl.value = /^(fa|ar|he|ur|ps|ku|yi|sd)(?:-|$)/i.test(el.value.trim()) ? 'rtl' : 'ltr';
        }
      }
      syncScalarField(el, false);
    });

    document.addEventListener('change', (e) => {
      const el = e.target;
      if (el.dataset.wizBool) {
        setPath(wizardDraft, el.dataset.wizBool, el.checked);
        render();
      } else if (el.dataset.wizPage) {
        if (el.checked) wizardDraft.selectedPages.add(el.dataset.wizPage);
        else wizardDraft.selectedPages.delete(el.dataset.wizPage);
      } else if (el.dataset.cfgBool) {
        setPath(configDraft, el.dataset.cfgBool, el.checked);
      } else if (el.dataset.cfgQcCh) {
        const ch = el.dataset.cfgQcCh;
        const list = new Set(configDraft.ui.quickContact.channels || []);
        if (el.checked) list.add(ch); else list.delete(ch);
        configDraft.ui.quickContact.channels = [...list];
      } else if (el.dataset.uploadLogo) {
        const [variant, target] = el.dataset.uploadLogo.split(':');
        uploadLogoFile(el.files?.[0], variant, target);
      } else if (el.id === 'i18n-opt-draft') {
        i18nAllowDraft = el.checked;
      } else if (el.id === 'i18n-opt-delcontent') {
        i18nDeleteContent = el.checked;
      } else if (el.id === 'i18n-status-filter') {
        i18nFilterStatus = el.value;
        i18nPage = 0;
        render();
      } else if (el.id === 'i18n-cat-filter') {
        i18nFilterCategory = el.value;
        i18nPage = 0;
        render();
      } else if (el.id === 'i18n-page-size') {
        i18nPageSize = Number(el.value) || 50;
        i18nPage = 0;
        render();
      } else if (modalState?.type === 'entry' && (el.dataset.efmBool || el.dataset.efmCustomBool)) {
        const fm = modalState.data.frontmatter;
        if (el.dataset.efmBool) fm[el.dataset.efmBool] = el.checked;
        else if (el.dataset.efmCustomBool) fm[el.dataset.efmCustomBool] = el.checked;
      } else if (modalState?.type === 'sections' && el.dataset.psecBool) {
        modalState.data[el.dataset.psecBool] = el.checked;
      } else if (modalState?.type === 'contentType' && (el.dataset.ctBool || el.dataset.ctSearchEn || el.dataset.ctfBool || el.dataset.ctfFilterEn !== undefined)) {
        const ct = modalState.data;
        if (el.dataset.ctBool) ct[el.dataset.ctBool] = el.checked;
        else if (el.dataset.ctSearchEn) {
          ct.search = ct.search || {};
          ct.search.enabled = el.checked;
        } else if (el.dataset.ctfBool) {
          const [fi, prop] = el.dataset.ctfBool.split(':');
          ct.fields[Number(fi)][prop] = el.checked;
        } else if (el.dataset.ctfFilterEn !== undefined) {
          const fi = Number(el.dataset.ctfFilterEn);
          ct.fields[fi].filter = el.checked ? { enabled: true, mode: 'multi', sort: 'alpha' } : undefined;
          renderModal();
        }
      } else if (el.id === 'add-lang-dir') {
        el.dataset.dirTouched = '1';
      } else if (el.type !== 'checkbox' && el.type !== 'file') {
        syncScalarField(el, true);
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modalState) {
        closeModal();
      }
    });

    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;

      if (btn.dataset.modalClose) {
        closeModal();
        return;
      }
      if (btn.dataset.confirmCancel) {
        confirmTarget = '';
        render();
        return;
      }
      if (btn.dataset.confirmArm) {
        confirmTarget = btn.dataset.confirmArm;
        render();
        return;
      }
      if (btn.dataset.cfgSub) {
        configSubTab = btn.dataset.cfgSub;
        localStorage.setItem('studio_config_subtab', configSubTab);
        render();
        return;
      }
      if (btn.dataset.cfgClear) {
        setPath(configDraft, btn.dataset.cfgClear, '');
        render();
        return;
      }
      if (btn.dataset.wizClear) {
        setPath(wizardDraft, btn.dataset.wizClear, '');
        render();
        return;
      }
      if (btn.dataset.colSelect) {
        activeCollection = btn.dataset.colSelect;
        confirmTarget = '';
        render();
        return;
      }
      if (btn.dataset.wizBp !== undefined) {
        const bpKey = btn.dataset.wizBp;
        wizardDraft.blueprint = bpKey;
        const bp = state.blueprints?.[bpKey];
        if (bp) {
          if (bp.preset) wizardDraft.brand.preset = bp.preset;
          if (bp.fontPreset) wizardDraft.brand.fontPreset = bp.fontPreset;
          if (bp.rtlFontPreset) wizardDraft.brand.rtlFontPreset = bp.rtlFontPreset;
          if (bp.socialCardMode) wizardDraft.brand.socialCardMode = bp.socialCardMode;
        }
        render();
        return;
      }
      if (btn.dataset.secMove) {
        const [scope, idxStr, deltaStr] = btn.dataset.secMove.split(':');
        const arr = resolveSectionArray(scope);
        const i = Number(idxStr), d = Number(deltaStr);
        const j = i + d;
        if (arr && j >= 0 && j < arr.length) {
          [arr[i], arr[j]] = [arr[j], arr[i]];
          if (scope === 'modal') renderModal(); else render();
        }
        return;
      }
      if (btn.dataset.secDel) {
        const [scope, idxStr] = btn.dataset.secDel.split(':');
        const arr = resolveSectionArray(scope);
        if (arr) {
          arr.splice(Number(idxStr), 1);
          if (scope === 'modal') renderModal(); else render();
        }
        return;
      }

      // Config & CMS structural additions/deletions
      if (btn.dataset.cfgDelAuthor) {
        delete configDraft.site.authors[btn.dataset.cfgDelAuthor];
        render();
        return;
      }
      if (btn.dataset.cfgDelTopic !== undefined) {
        configDraft.api.topics.splice(Number(btn.dataset.cfgDelTopic), 1);
        render();
        return;
      }
      if (btn.dataset.cfgMoveNavpage) {
        const [i, d] = btn.dataset.cfgMoveNavpage.split(':').map(Number);
        const arr = configDraft.ui?.navigation?.pages;
        const j = i + d;
        if (arr && j >= 0 && j < arr.length) {
          [arr[i], arr[j]] = [arr[j], arr[i]];
          render();
        }
        return;
      }
      if (btn.dataset.cfgDelNavpage !== undefined) {
        configDraft.ui.navigation.pages.splice(Number(btn.dataset.cfgDelNavpage), 1);
        render();
        return;
      }
      if (btn.dataset.cfgMoveFcol) {
        const [i, d] = btn.dataset.cfgMoveFcol.split(':').map(Number);
        const arr = configDraft.ui?.navigation?.footerColumns;
        const j = i + d;
        if (arr && j >= 0 && j < arr.length) {
          [arr[i], arr[j]] = [arr[j], arr[i]];
          render();
        }
        return;
      }
      if (btn.dataset.cfgAddFitem !== undefined) {
        const col = configDraft.ui.navigation.footerColumns[Number(btn.dataset.cfgAddFitem)];
        col.items = col.items || [];
        col.items.push({ group: 'about', label: 'About', labels: {} });
        render();
        return;
      }
      if (btn.dataset.cfgDelFcol !== undefined) {
        configDraft.ui.navigation.footerColumns.splice(Number(btn.dataset.cfgDelFcol), 1);
        render();
        return;
      }
      if (btn.dataset.cfgMoveFitem) {
        const [ci, ii, d] = btn.dataset.cfgMoveFitem.split(':').map(Number);
        const arr = configDraft.ui?.navigation?.footerColumns?.[ci]?.items;
        const j = ii + d;
        if (arr && j >= 0 && j < arr.length) {
          [arr[ii], arr[j]] = [arr[j], arr[ii]];
          render();
        }
        return;
      }
      if (btn.dataset.cfgDelFitem) {
        const [ci, ii] = btn.dataset.cfgDelFitem.split(':').map(Number);
        configDraft.ui.navigation.footerColumns[ci].items.splice(ii, 1);
        render();
        return;
      }
      if (btn.dataset.cfgDelRedirect !== undefined) {
        configDraft.redirects.splice(Number(btn.dataset.cfgDelRedirect), 1);
        render();
        return;
      }
      if (btn.dataset.cmsDelRedirect !== undefined) {
        cmsDraft.redirects.splice(Number(btn.dataset.cmsDelRedirect), 1);
        render();
        return;
      }

      // Content Type Modal triggers
      if (btn.dataset.ctNew) {
        openModal('contentType', {
          isNew: true, key: '', base: '', enabled: true, index: true, paginated: false, feed: false, nav: true,
          labels: {}, descriptions: {}, card: { layout: 'grid', aspectRatio: 'video', badgeLimit: 3 }, search: { enabled: true }, fields: [],
        });
        return;
      }
      if (btn.dataset.ctEdit) {
        const found = state.contentTypes.find((x) => x.key === btn.dataset.ctEdit);
        if (found) openModal('contentType', { ...deepClone(found), isNew: false });
        return;
      }
      if (btn.dataset.ctMoveField && modalState?.type === 'contentType') {
        const [fi, d] = btn.dataset.ctMoveField.split(':').map(Number);
        const arr = modalState.data.fields;
        const j = fi + d;
        if (arr && j >= 0 && j < arr.length) {
          [arr[fi], arr[j]] = [arr[j], arr[fi]];
          renderModal();
        }
        return;
      }
      if (btn.dataset.ctDelField !== undefined && modalState?.type === 'contentType') {
        modalState.data.fields.splice(Number(btn.dataset.ctDelField), 1);
        renderModal();
        return;
      }
      if (btn.dataset.ctDelExec) {
        const [key, mode] = btn.dataset.ctDelExec.split(':');
        confirmTarget = '';
        await withBusy('content-type-delete', async () => {
          try {
            const res = await apiPost('api/content-type-delete', { key, deleteFiles: mode === 'files' });
            logConsole('content-type-delete ' + key, JSON.stringify(res.syncResult, null, 2), true);
            showToast(key + ' deleted');
            await refreshState({ resetDrafts: true });
          } catch (err) {
            showToast(err.message);
            logConsole('content-type-delete', err.message, false);
          }
        });
        return;
      }

      // Content Entry & Sections modals
      if (btn.dataset.entryEdit) {
        const [collection, group, locale] = btn.dataset.entryEdit.split('|');
        try {
          const res = await apiGet(`api/content-entry?collection=${encodeURIComponent(collection)}&group=${encodeURIComponent(group)}&locale=${encodeURIComponent(locale)}`);
          openModal('entry', res);
        } catch (err) {
          showToast(err.message);
        }
        return;
      }
      if (btn.dataset.secModal) {
        const [group, locale] = btn.dataset.secModal.split('|');
        const pGroup = state.pages.find((p) => p.group === group);
        const info = pGroup?.locales?.[locale];
        if (info) {
          openModal('sections', {
            group, locale, hero: info.hero === false ? 'none' : info.hero === true ? 'default' : (info.hero || 'none'),
            container: info.container || 'canvas', flushTop: Boolean(info.flushTop), sections: deepClone(info.sections || []),
          });
        }
        return;
      }
      if (btn.dataset.entryDelExec) {
        const [col, group] = btn.dataset.entryDelExec.split('|');
        confirmTarget = '';
        if (col === 'pages') {
          await runCliAction('remove:page', { group }, 'remove:page ' + group);
        } else {
          await runCliAction('remove:post', { collection: col, group }, `remove:post ${col}/${group}`);
        }
        return;
      }
      if (btn.dataset.entryDelLocExec) {
        const [col, group, locale] = btn.dataset.entryDelLocExec.split('|');
        confirmTarget = '';
        if (col === 'pages') {
          await runCliAction('remove:page', { group, locale }, `remove:page ${group} (${locale})`);
        } else {
          await runCliAction('remove:post', { collection: col, group, locale }, `remove:post ${col}/${group} (${locale})`);
        }
        return;
      }

      // Locales & Messages actions
      if (btn.dataset.locEdit) {
        const loc = btn.dataset.locEdit;
        const meta = state.locales.metadata?.[loc] || {};
        openModal('localeMeta', { locale: loc, name: meta.name || loc, dir: meta.dir || 'ltr', htmlLang: meta.htmlLang || loc, fontFamily: meta.fontFamily || 'var(--font-sans)' });
        return;
      }
      if (btn.dataset.locDelExec) {
        confirmTarget = '';
        await runCliAction('i18n:remove-lang', { code: btn.dataset.locDelExec, deleteContent: i18nDeleteContent }, 'i18n:remove-lang ' + btn.dataset.locDelExec);
        return;
      }
      if (btn.dataset.i18nPage !== undefined) {
        i18nPage = Number(btn.dataset.i18nPage);
        render();
        return;
      }
      if (btn.dataset.msgRevert) {
        const [loc, key] = btn.dataset.msgRevert.split('|');
        msgDirty[loc] = msgDirty[loc] || {};
        msgDirty[loc][key] = null;
        render();
        return;
      }
      if (btn.dataset.msgDelKey) {
        const k = btn.dataset.msgDelKey;
        if (msgDeleteQueue.has(k)) msgDeleteQueue.delete(k); else msgDeleteQueue.add(k);
        render();
        return;
      }

      // Direct CLI buttons
      if (btn.dataset.cli) {
        confirmTarget = '';
        const action = btn.dataset.cli;
        const payload = {};
        if (btn.dataset.cliType) payload.type = btn.dataset.cliType;
        if (btn.dataset.cliCode) payload.code = btn.dataset.cliCode;
        if (btn.dataset.cliDry) payload.dryRun = true;
        if (btn.dataset.cliHandoff) payload.handoff = true;
        if (btn.dataset.cliBrand) payload.brandOnly = true;
        if (btn.dataset.cliForce) payload.force = true;
        if (btn.dataset.cliClean) payload.clean = true;
        if (action === 'i18n:set-default' || action === 'i18n:solo') {
          payload.allowDraft = i18nAllowDraft;
        }
        if (action === 'i18n:solo') {
          payload.deleteContent = i18nDeleteContent;
        }
        await runCliAction(action, payload, action + (payload.type ? ' ' + payload.type : payload.code ? ' ' + payload.code : ''));
        return;
      }

      // Named high-level actions
      const act = btn.dataset.action;
      if (!act) return;

      if (act === 'save-project-meta') {
        await withBusy('project-meta', async () => {
          try {
            const res = await apiPost('api/project-meta', projectDraft);
            logConsole('project-meta', 'Updated: ' + res.updatedFiles.join(', '), true);
            showToast(L('هویت پروژه و .env ذخیره شد', 'Project metadata saved'));
            await refreshState({ resetDrafts: true });
          } catch (err) {
            showToast(err.message);
            logConsole('project-meta', err.message, false);
          }
        });
      } else if (act === 'wiz-add-sec') {
        const block = document.getElementById('wiz-add-block-sel')?.value || 'LandingHeroSplit';
        wizardDraft.homeSections.push({ block, props: deepClone(DEFAULT_BLOCK_PROPS[block] || {}) });
        render();
      } else if (act === 'wiz-clear-sec') {
        wizardDraft.homeSections = [];
        render();
      } else if (act === 'cfg-add-sec') {
        const block = document.getElementById('cfg-add-block-sel')?.value || 'LandingHeroSplit';
        configDraft.ui.homeSections = configDraft.ui.homeSections || [];
        configDraft.ui.homeSections.push({ block, props: deepClone(DEFAULT_BLOCK_PROPS[block] || {}) });
        render();
      } else if (act === 'cfg-sync-preset') {
        const pal = state.themePresets?.palettes?.[configDraft.brand?.preset];
        if (pal) {
          configDraft.brand.primaryColor = '';
          configDraft.brand.accentColor = '';
          if (pal.primary) configDraft.brand.themeColor = pal.primary;
          render();
          showToast(L('رنگ‌ها با پالت همگام شدند', 'Colors synced to preset'));
        }
      } else if (act === 'wiz-copy-spec') {
        if (hasInvalidJsonInputs()) return showToast(L('لطفاً خطای JSON را برطرف کنید', 'Fix invalid JSON inputs first'));
        navigator.clipboard?.writeText(JSON.stringify(buildWizardSpec(), null, 2));
        showToast(L('Spec JSON کپی شد', 'Spec JSON copied'));
      } else if (act === 'wiz-dry' || act === 'wiz-apply') {
        if (hasInvalidJsonInputs()) return showToast(L('لطفاً خطای JSON را برطرف کنید', 'Fix invalid JSON inputs first'));
        const dryRun = act === 'wiz-dry';
        await withBusy('site:apply', async () => {
          try {
            const res = await apiPost('api/site-apply', {
              spec: buildWizardSpec(),
              dryRun,
              skipAssets: Boolean(wizardDraft.skipAssets),
            });
            logConsole('site:apply' + (dryRun ? ' --dry-run' : ''), JSON.stringify(res, null, 2), true);
            showToast(dryRun ? 'Dry-run OK' : 'Site configured ✓');
            if (!dryRun) await refreshState({ resetDrafts: true });
          } catch (err) {
            showToast(err.message);
            logConsole('site:apply', err.message, false);
          }
        });
      } else if (act === 'cfg-add-author') {
        const id = document.getElementById('new-author-id')?.value.trim();
        if (!id || !/^[a-zA-Z0-9_-]+$/.test(id)) return showToast(L('کلید نویسنده باید حروف انگلیسی، عدد، - یا _ باشد', 'Author key must use letters, digits, - or _'));
        configDraft.site.authors = configDraft.site.authors || {};
        if (configDraft.site.authors[id]) return showToast(L('این کلید نویسنده قبلاً ثبت شده است', 'Author key already exists'));
        configDraft.site.authors[id] = { name: id, jobTitle: '', description: '', url: '', image: '', sameAs: [] };
        render();
      } else if (act === 'cfg-add-topic') {
        configDraft.api.topics = configDraft.api.topics || [];
        configDraft.api.topics.push({ value: 'general', label: 'General', labels: {} });
        render();
      } else if (act === 'cfg-add-navpage') {
        configDraft.ui.navigation = configDraft.ui.navigation || {};
        configDraft.ui.navigation.pages = configDraft.ui.navigation.pages || [];
        configDraft.ui.navigation.pages.push({ group: 'about', icon: 'info', labels: {} });
        render();
      } else if (act === 'cfg-add-fcol') {
        configDraft.ui.navigation = configDraft.ui.navigation || {};
        configDraft.ui.navigation.footerColumns = configDraft.ui.navigation.footerColumns || [];
        configDraft.ui.navigation.footerColumns.push({ key: 'links', title: 'Links', titles: {}, items: [] });
        render();
      } else if (act === 'cfg-add-redirect') {
        configDraft.redirects = configDraft.redirects || [];
        configDraft.redirects.push({ from: '/old-path', to: '/', status: 301 });
        render();
      } else if (act === 'cms-add-redirect') {
        cmsDraft.redirects = cmsDraft.redirects || [];
        cmsDraft.redirects.push({ from: '/old-path', to: '/', status: 301 });
        render();
      } else if (act === 'toggle-diff-json') {
        showDiffJson = !showDiffJson;
        render();
      } else if (act === 'reset-config-confirm') {
        if (confirmTarget === 'cfg:reset') {
          confirmTarget = '';
          await runCliAction('site:reset', {}, 'site:reset');
        } else {
          confirmTarget = 'cfg:reset';
          showToast(L('برای تایید ریست دوباره کلیک کنید', 'Click again to confirm site:reset'));
        }
      } else if (act === 'save-config') {
        if (hasInvalidJsonInputs()) return showToast(L('لطفاً خطای JSON را برطرف کنید', 'Fix invalid JSON inputs first'));
        confirmTarget = '';
        await withBusy('config-save', async () => {
          try {
            const payload = deepClone(configDraft);
            delete payload.content;
            const res = await apiPost('api/config-save', { patch: payload, replace: true });
            logConsole('config-save', JSON.stringify(res.clientOverrides, null, 2), true);
            showToast(L('تنظیمات در client/config.json ذخیره شد', 'Saved client/config.json'));
            await refreshState({ resetDrafts: true });
          } catch (err) {
            showToast(err.message);
            logConsole('config-save', err.message, false);
          }
        });
      } else if (act === 'toggle-pagesyml') {
        showPagesYmlRaw = !showPagesYmlRaw;
        render();
      } else if (act === 'cms-save') {
        await withBusy('cms-save', async () => {
          try {
            const res = await apiPost('api/cms-save', { cms: cmsDraft });
            logConsole('cms-save', JSON.stringify(res.cmsOverrides, null, 2), true);
            showToast(L('تنظیمات CMS ذخیره شد', 'Saved client/cms.json'));
            await refreshState({ resetDrafts: true });
          } catch (err) {
            showToast(err.message);
            logConsole('cms-save', err.message, false);
          }
        });
      } else if (act === 'cms-reset') {
        confirmTarget = '';
        await withBusy('cms-reset', async () => {
          try {
            await apiPost('api/cms-save', { reset: true });
            showToast(L('فایل client/cms.json پاک‌سازی شد', 'Reset client/cms.json'));
            await refreshState({ resetDrafts: true });
          } catch (err) {
            showToast(err.message);
          }
        });
      } else if (act === 'ct-add-field' && modalState?.type === 'contentType') {
        modalState.data.fields = modalState.data.fields || [];
        modalState.data.fields.push({ name: 'field_' + (modalState.data.fields.length + 1), type: 'string', required: false, cms: true });
        renderModal();
      } else if (act === 'ct-save' && modalState?.type === 'contentType') {
        const ct = modalState.data;
        if (!ct.key || !/^[a-z0-9-]+$/.test(ct.key)) {
          return showToast(L('کلید نوع محتوا باید حروف کوچک انگلیسی، عدد یا خط تیره باشد', 'Content type key must match [a-z0-9-]+'));
        }
        const seenFields = new Set();
        for (const f of ct.fields || []) {
          if (!f.name || !/^[a-zA-Z_][a-zA-Z0-9_]*$/.test(f.name)) {
            return showToast(L('نام فیلد نامعتبر: ' + (f.name || '(empty)'), 'Invalid field name: ' + (f.name || '(empty)')));
          }
          if (seenFields.has(f.name)) {
            return showToast(L('نام فیلد تکراری: ' + f.name, 'Duplicate field name: ' + f.name));
          }
          seenFields.add(f.name);
        }
        await withBusy('content-type-save', async () => {
          try {
            const res = await apiPost('api/content-type-save', modalState.data);
            logConsole('content-type-save ' + res.key, JSON.stringify(res.syncResult, null, 2), true);
            closeModal();
            showToast(L('اسکیمای نوع محتوا ذخیره و همگام‌سازی شد', 'Content type schema saved & synced'));
            await refreshState({ resetDrafts: true });
          } catch (err) {
            showToast(err.message);
            logConsole('content-type-save', err.message, false);
          }
        });
      } else if (act === 'create-entry') {
        const group = document.getElementById('new-entry-group')?.value.trim();
        const title = document.getElementById('new-entry-title')?.value.trim();
        const slug = document.getElementById('new-entry-slug')?.value.trim();
        const locale = document.getElementById('new-entry-locale')?.value;
        const publish = document.getElementById('new-entry-pub')?.checked;
        if (!group || !/^[a-z0-9-]+$/.test(group)) {
          return showToast(L('کلید گروه باید حروف کوچک انگلیسی، عدد یا خط تیره باشد', 'Group key must use lowercase letters, digits, or hyphens'));
        }
        if (activeCollection === 'pages') {
          const preset = document.getElementById('new-entry-preset')?.value;
          await runCliAction('new:page', { group, title, slug, locale, preset, publish }, 'new:page ' + group);
        } else if (activeCollection === 'blog') {
          const categories = document.getElementById('new-entry-cats')?.value.trim();
          const tags = document.getElementById('new-entry-tags')?.value.trim();
          await runCliAction('new:post', { collection: activeCollection, group, title, slug, locale, categories, tags, publish }, `new:post blog/${group}`);
        } else {
          const desc = document.getElementById('new-entry-desc')?.value.trim();
          await runCliAction('content:new', { type: activeCollection, group, title, slug, desc, locale, publish }, `content:new ${activeCollection}/${group}`);
        }
      } else if (act === 'save-entry' && modalState?.type === 'entry') {
        const fm = modalState.data.frontmatter || {};
        if (!String(fm.title || '').trim()) {
          return showToast(L('فیلد title الزامی است', 'Title is required'));
        }
        if (!(modalState.data.collection === 'pages' && modalState.data.group === 'home') && !String(fm.slug || '').trim()) {
          return showToast(L('فیلد slug الزامی است', 'Slug is required'));
        }
        for (const f of modalState.data.customFields || []) {
          if (!f.required) continue;
          const v = fm[f.name];
          if (v === undefined || v === null || v === '' || (Array.isArray(v) && v.length === 0)) {
            return showToast(L(`فیلد الزامی «${f.name}» نباید خالی باشد`, `Required field "${f.name}" cannot be empty`));
          }
        }
        await withBusy('content-entry', async () => {
          try {
            const res = await apiPost('api/content-entry', {
              collection: modalState.data.collection,
              group: modalState.data.group,
              locale: modalState.data.locale,
              frontmatter: modalState.data.frontmatter,
              body: modalState.data.body,
            });
            logConsole('content-entry', 'Saved ' + res.file, true);
            closeModal();
            showToast(L('محتوا ذخیره شد', 'Entry saved'));
            await refreshState();
          } catch (err) {
            showToast(err.message);
            logConsole('content-entry', err.message, false);
          }
        });
      } else if (act === 'modal-add-sec' && modalState?.type === 'sections') {
        const block = document.getElementById('modal-add-block-sel')?.value || 'LandingHeroSplit';
        modalState.data.sections.push({ block, props: deepClone(DEFAULT_BLOCK_PROPS[block] || {}) });
        renderModal();
      } else if (act === 'save-page-sections' && modalState?.type === 'sections') {
        if (hasInvalidJsonInputs(document.getElementById('modal-card'))) {
          return showToast(L('لطفاً خطای JSON سکشن‌ها را برطرف کنید', 'Fix invalid JSON props first'));
        }
        await withBusy('page-sections', async () => {
          try {
            const d = modalState.data;
            const res = await apiPost('api/page-sections', {
              group: d.group, locale: d.locale, hero: d.hero, container: d.container, flushTop: d.flushTop, sections: d.sections,
            });
            logConsole('page-sections', 'Updated ' + res.file, true);
            closeModal();
            showToast(L('سکشن‌ها ذخیره شدند', 'Sections saved'));
            await refreshState();
          } catch (err) {
            showToast(err.message);
            logConsole('page-sections', err.message, false);
          }
        });
      } else if (act === 'add-lang') {
        const code = document.getElementById('add-lang-code')?.value.trim();
        if (!code || !/^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$/.test(code)) {
          return showToast(L('کد زبان معتبر وارد کنید (مثلاً ar یا de)', 'Enter a valid locale code (e.g. ar or de)'));
        }
        const name = document.getElementById('add-lang-name')?.value.trim();
        const dir = document.getElementById('add-lang-dir')?.value;
        const from = document.getElementById('add-lang-from')?.value;
        const htmlLang = document.getElementById('add-lang-htmllang')?.value.trim();
        const fontFamily = document.getElementById('add-lang-font')?.value.trim();
        const withContent = document.getElementById('add-lang-content')?.checked;
        const publish = document.getElementById('add-lang-pub')?.checked;
        await runCliAction('i18n:add-lang', { code, name, dir, from, htmlLang, fontFamily, withContent, publish }, 'i18n:add-lang ' + code);
      } else if (act === 'lm-save' && modalState?.type === 'localeMeta') {
        await withBusy('locale-meta', async () => {
          try {
            const res = await apiPost('api/locale-meta', modalState.data);
            logConsole('locale-meta', JSON.stringify(res.meta, null, 2), true);
            closeModal();
            showToast(L('متادیتای زبان ذخیره شد', 'Locale metadata saved'));
            await refreshState();
          } catch (err) {
            showToast(err.message);
          }
        });
      } else if (act === 'add-i18n-key') {
        const category = document.getElementById('add-key-cat')?.value.trim() || 'custom';
        const key = document.getElementById('add-key-name')?.value.trim();
        if (!key || !/^[A-Za-z0-9_]+$/.test(key)) {
          return showToast(L('نام کلید را با حروف انگلیسی و _ وارد کنید', 'Enter a valid alphanumeric key name'));
        }
        const translations = {};
        document.querySelectorAll('[data-add-key-loc]').forEach((inp) => {
          if (inp.value.trim()) translations[inp.dataset.addKeyLoc] = inp.value.trim();
        });
        await runCliAction('i18n:add', { category, key, translations }, `i18n:add ${category}_${key}`);
      } else if (act === 'discard-messages') {
        msgDirty = {};
        msgDeleteQueue.clear();
        render();
      } else if (act === 'save-messages') {
        if (hasInvalidJsonInputs()) {
          return showToast(L('لطفاً خطای JSON آرایه را برطرف کنید', 'Fix invalid JSON array inputs first'));
        }
        await withBusy('messages-save', async () => {
          try {
            const res = await apiPost('api/messages-save', {
              updatesByLocale: msgDirty,
              deleteKeys: [...msgDeleteQueue],
            });
            msgDirty = {};
            msgDeleteQueue.clear();
            logConsole('messages-save', 'Updated locales: ' + (res.updatedLocales.join(', ') || 'compiled'), true);
            showToast(L('ترجمه‌ها ذخیره و کامپایل شدند', 'Translations saved & compiled'));
            await refreshState();
          } catch (err) {
            showToast(err.message);
            logConsole('messages-save', err.message, false);
          }
        });
      }
    });

    document.getElementById('modal-root').addEventListener('click', (e) => {
      if (e.target.id === 'modal-root') closeModal();
    });

    // Boot
    document.documentElement.dataset.theme = localStorage.getItem('studio_theme') || 'dark';
    updateChrome();
    refreshState().catch((err) => logConsole('Studio Boot', err.message, false));
  </script>
</body>
</html>
