    :root {
      --bg: #0b0f17;
      --surface: #121826;
      --surface-2: #192234;
      --border: #27344d;
      --text: #eef2f8;
      --muted: #93a4bf;
      --primary: #4f7cff;
      --primary-fg: #ffffff;
      --accent: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
      --radius: 12px;
      --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Vazirmatn', Tahoma, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    html[data-theme="light"] {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --surface-2: #eef2f8;
      --border: #d5deec;
      --text: #0f172a;
      --muted: #52637d;
      --primary: #3b5bdb;
      --primary-fg: #ffffff;
      --accent: #059669;
      --warn: #d97706;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; }
    html {
      scroll-padding-top: 76px;
      scroll-padding-bottom: 120px;
    }
    html:has(body.console-open) {
      scroll-padding-bottom: 370px;
    }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.55;
    }
    a { color: var(--primary); text-decoration: none; }
    button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
    code, pre, .mono { font-family: var(--mono); direction: ltr; unicode-bidi: isolate; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 700; font-size: 15px; }
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600;
      background: var(--surface-2); border: 1px solid var(--border); color: var(--muted);
    }
    .badge.ok { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 42%, transparent); }
    .badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 42%, transparent); cursor: pointer; }
    .badge.err { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 42%, transparent); }
    .topbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .shell { max-width: 1380px; margin: 0 auto; padding: 18px 20px 140px; }
    body.console-open .shell { padding-bottom: 380px; }
    .tabs {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
    }
    .subtabs {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-bottom: 14px; padding: 8px; border-radius: 10px;
      background: var(--surface); border: 1px solid var(--border);
    }
    .tab-btn {
      padding: 8px 13px; border-radius: 9px; border: 1px solid var(--border);
      background: var(--surface); color: var(--muted); cursor: pointer; font-weight: 600; font-size: 13px;
      transition: all 0.15s ease;
    }
    .tab-btn:hover { border-color: var(--primary); color: var(--text); }
    .tab-btn.active { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
    .subtab-btn {
      padding: 6px 11px; border-radius: 7px; border: 1px solid transparent;
      background: transparent; color: var(--muted); cursor: pointer; font-weight: 600; font-size: 12.5px;
    }
    .subtab-btn:hover { color: var(--text); background: var(--surface-2); }
    .subtab-btn.active { background: var(--surface-2); color: var(--text); border-color: var(--primary); }
    .grid { display: grid; gap: 14px; }
    .grid-2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
    .grid-3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .grid-4 { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px;
    }
    .card + .card { margin-top: 14px; }
    .card h2, .card h3 { margin: 0 0 8px; font-size: 15px; }
    .card-sub { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; }
    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
    .field label { font-size: 12px; font-weight: 600; color: var(--muted); }
    input[type="text"], input[type="email"], input[type="url"], input[type="number"], input[type="date"], select, textarea {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 7px 10px; outline: none; font-size: 13px;
    }
    input[type="color"] {
      width: 44px; height: 34px; padding: 2px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg); cursor: pointer;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    textarea { min-height: 86px; resize: vertical; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .between { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 7px 12px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--text); cursor: pointer; font-weight: 600; font-size: 13px;
    }
    .btn:hover:not(:disabled) { border-color: var(--primary); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
    .btn-accent { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
    .btn-danger { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, transparent); }
    .btn-sm { padding: 4px 9px; font-size: 12px; border-radius: 7px; }
    .bp-card {
      text-align: start; padding: 11px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg); cursor: pointer; display: flex; flex-direction: column; gap: 4px;
    }
    .bp-card:hover { border-color: var(--primary); }
    .bp-card.selected { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 13%, var(--bg)); }
    .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.25); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: start; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { font-size: 11.5px; color: var(--muted); font-weight: 600; white-space: nowrap; }
    .sec-item {
      border: 1px solid var(--border); background: var(--bg); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
    }
    .logo-preview {
      max-height: 44px; max-width: 140px; object-fit: contain; padding: 4px 8px;
      border-radius: 8px; border: 1px solid var(--border); background: var(--bg);
    }
    .check-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px;
      border-radius: 8px; border: 1px solid var(--border); background: var(--bg); font-size: 12.5px; cursor: pointer;
    }
    .console-dock {
      position: fixed; bottom: 0; inset-inline: 0; z-index: 45;
      background: var(--surface); border-top: 1px solid var(--border);
      box-shadow: 0 -8px 28px rgba(0,0,0,0.32);
    }
    .console-bar {
      max-width: 1380px; margin: 0 auto; padding: 8px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer;
    }
    .console-body {
      max-width: 1380px; margin: 0 auto; padding: 0 20px 14px;
      max-height: 260px; overflow: auto;
    }
    .console-pre {
      margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--bg);
      border: 1px solid var(--border); font-size: 12px; white-space: pre-wrap; word-break: break-word;
    }
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.65);
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-card {
      width: min(980px, 100%); max-height: 90vh; overflow: auto;
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px;
    }
    .hidden { display: none !important; }
    .toast {
      position: fixed; top: 64px; inset-inline-end: 20px; z-index: 75;
      padding: 10px 14px; border-radius: 10px; background: var(--surface-2);
      border: 1px solid var(--primary); box-shadow: 0 10px 25px rgba(0,0,0,0.35); font-weight: 600;
      max-width: 420px;
    }
    .sticky-save-bar {
      position: sticky; bottom: 52px; z-index: 30; margin-top: 14px;
      background: color-mix(in srgb, var(--surface) 94%, transparent);
      backdrop-filter: blur(8px);
      border: 1px solid var(--primary); border-radius: 12px; padding: 10px 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    }
    body.console-open .sticky-save-bar {
      bottom: 306px;
    }
    .muted { color: var(--muted); font-size: 12px; }
    .divider { height: 1px; background: var(--border); margin: 12px 0; }
  </style>
</head>

    function isFa() { return uiLang === 'fa'; }
    function L(faText, enText) { return isFa() ? faText : enText; }
    function t() { return COPY[uiLang] || COPY.fa; }

    function esc(v) {
      return String(v ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function deepClone(obj) {
      return JSON.parse(JSON.stringify(obj ?? {}));
    }

    function getPath(obj, dotPath, fallback = undefined) {
      const parts = dotPath.split('.');
      let cur = obj;
      for (const p of parts) {
        if (cur === null || cur === undefined || typeof cur !== 'object') return fallback;
        cur = cur[p];
      }
      return cur === undefined ? fallback : cur;
    }

    function setPath(obj, dotPath, value) {
      const parts = dotPath.split('.');
      let cur = obj;
      for (let i = 0; i < parts.length - 1; i++) {
        const k = parts[i];
        if (!cur[k] || typeof cur[k] !== 'object' || Array.isArray(cur[k])) {
          cur[k] = {};
        }
        cur = cur[k];
      }
      cur[parts[parts.length - 1]] = value;
    }

    function showToast(msg) {
      const el = document.getElementById('toast-root');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(el._timer);
      el._timer = setTimeout(() => el.classList.add('hidden'), 3400);
    }

    function setConsoleOpen(open) {
      const body = document.getElementById('console-body');
      const chev = document.getElementById('console-chevron');
      body.classList.toggle('hidden', !open);
      document.body.classList.toggle('console-open', Boolean(open));
      chev.textContent = open ? '▼' : '▲';
    }

    function logConsole(label, text, ok = true, durationMs = null) {
      const status = document.getElementById('console-status');
      const lbl = document.getElementById('console-label');
      const pre = document.getElementById('console-pre');

      lbl.textContent = label + (durationMs !== null ? ' (' + durationMs + ' ms)' : '');
      status.textContent = ok ? 'OK' : 'ERROR';
      status.className = 'badge ' + (ok ? 'ok' : 'err');
      pre.textContent = text || (ok ? 'Completed successfully.' : 'Command failed.');
      setConsoleOpen(true);
    }

    async function apiGet(path) {
      const res = await fetch(path, { headers: { Accept: 'application/json' } });
      const data = await res.json();
      if (!res.ok || data.ok === false) {
        throw new Error(data.error || 'Request failed');
      }
      return data;
    }

    async function apiPost(path, payload) {
      const res = await fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (!res.ok || data.ok === false) {
        const err = new Error(data.error || 'Request failed');
        err.output = data.output;
        throw err;
      }
      return data;
    }

          const localesObj = {};

    async function refreshState({ resetDrafts = false } = {}) {
      state = await apiGet('api/state');
      if (!projectDraft || resetDrafts) projectDraft = buildProjectDraft(state);
      if (!wizardDraft || resetDrafts) wizardDraft = buildDefaultWizardDraft(state);
      if (!configDraft || resetDrafts) configDraft = buildConfigDraft(state);
      if (!cmsDraft || resetDrafts) cmsDraft = buildCmsDraft(state);
      updateChrome();
      render();
    }

    async function withBusy(label, fn) {
      if (busy) return null;
      busy = true;
      const statusEl = document.getElementById('console-status');
      const prevStatus = statusEl.textContent;
      statusEl.textContent = t().running;
      statusEl.className = 'badge warn';
      try {
        return await fn();
      } finally {
        busy = false;
        if (statusEl.textContent === t().running) {
          statusEl.textContent = prevStatus || t().ready;
          statusEl.className = 'badge';
        }
      }
    }

    async function runCliAction(action, payload = {}, label = action) {
      return withBusy(label, async () => {
        try {
          const res = await apiPost('api/run-cli', { action, payload });
          logConsole(label, res.output, true, res.durationMs);
          showToast(label + ' ✓');
          await refreshState({ resetDrafts: action === 'site:reset' });
          return res;
        } catch (err) {
          logConsole(label, [err.message, err.output].filter(Boolean).join('\n'), false);
          showToast(err.message);
          return null;
        }
      });
    }

    async function uploadLogoFile(file, variant, target) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const res = await apiPost('api/upload-logo', { variant, dataUrl: reader.result });
          if (target === 'wizard') {
            if (variant === 'dark') wizardDraft.brand.logoDark = res.publicPath;
            else wizardDraft.brand.logoLight = res.publicPath;
          } else {
            configDraft.brand.logo = configDraft.brand.logo || {};
            if (variant === 'dark') configDraft.brand.logo.dark = res.publicPath;
            else configDraft.brand.logo.light = res.publicPath;
          }
          showToast(L('لوگو آپلود شد: ', 'Logo uploaded: ') + res.publicPath);
          render();
        } catch (err) {
          showToast(err.message);
          logConsole('upload-logo', err.message, false);
        }
      };
      reader.readAsDataURL(file);
    }

    // ---------- Tab 4: Pages & Collection Content Manager ----------
    function renderContentTab() {
      const types = state.contentTypes || [];
      if (!types.some((x) => x.key === activeCollection)) {
        activeCollection = 'pages';
      }
      const activeType = types.find((x) => x.key === activeCollection) || { key: 'pages', fields: [] };
      const locs = state.locales.locales;
      const rawGroups = activeCollection === 'pages' ? (state.pages || []) : (state.collections?.[activeCollection] || []);
      const q = contentSearch.trim().toLowerCase();
      const groups = q
        ? rawGroups.filter((g) => {
            if (g.group.toLowerCase().includes(q)) return true;
            return Object.values(g.locales || {}).some(
              (info) =>
                String(info.title || '').toLowerCase().includes(q) ||
                String(info.slug || '').toLowerCase().includes(q)
            );
          })
        : rawGroups;

      const pills = types.map((ct) => {
        const count = ct.key === 'pages' ? (state.pages?.length || 0) : (state.collections?.[ct.key]?.length || 0);
        return `<button type="button" class="subtab-btn ${activeCollection === ct.key ? 'active' : ''}" data-col-select="${esc(ct.key)}">
          ${esc(ct.key)} <span class="badge">${count}</span>
        </button>`;
      }).join('');

      const rowsHtml = groups.length === 0
        ? `<tr><td colspan="${locs.length + 2}" class="muted">${L('مطلبی در این کالکشن ثبت نشده است.', 'No matching entries in this collection.')}</td></tr>`
        : groups.map((g) => {
            const existingLocaleCount = Object.keys(g.locales || {}).length;
            const locCells = locs.map((loc) => {
              const info = g.locales?.[loc];
              if (!info) {
                return `<td>
                  <div class="row">
                    <span class="badge warn">missing</span>
                    <button type="button" class="btn btn-sm" data-entry-edit="${esc(activeCollection)}|${esc(g.group)}|${esc(loc)}">+ ${L('ایجاد', 'Create')}</button>
                  </div>
                </td>`;
              }
              const locArm = 'entrydel:' + activeCollection + ':' + g.group + ':' + loc;
              const isLocArmed = confirmTarget === locArm;
              const canDelLocale = existingLocaleCount > 1 && !(activeCollection === 'pages' && g.group === 'home' && loc === state.locales.defaultLocale);
              return `<td>
                <div style="margin-bottom:4px;"><strong>${esc(info.title || g.group)}</strong></div>
                <div class="row" style="margin-bottom:4px;">
                  <span class="badge ${info.draft ? 'warn' : 'ok'}">${info.draft ? 'draft' : 'published'}</span>
                  <span class="muted mono">/${esc(info.slug || '')}</span>
                  <span class="muted">${info.words || 0}w</span>
                  ${info.todos ? `<span class="badge warn">${info.todos} TODO</span>` : ''}
                </div>
                <div class="row">
                  <button type="button" class="btn btn-sm btn-primary" data-entry-edit="${esc(activeCollection)}|${esc(g.group)}|${esc(loc)}">${L('ویرایش', 'Edit')}</button>
                  ${activeCollection === 'pages' ? `<button type="button" class="btn btn-sm" data-sec-modal="${esc(g.group)}|${esc(loc)}">${L('سکشن‌ها', 'Sections')} (${info.sections?.length || 0})</button>` : ''}
                  ${canDelLocale ? (
                    isLocArmed
                      ? `<button type="button" class="btn btn-sm btn-danger" data-entry-del-loc-exec="${esc(activeCollection)}|${esc(g.group)}|${esc(loc)}">${L('تأیید حذف', 'Del')} ${esc(loc)}</button><button type="button" class="btn btn-sm" data-confirm-cancel="1">✕</button>`
                      : `<button type="button" class="btn btn-sm btn-danger" title="Delete ${esc(loc)}" data-confirm-arm="${esc(locArm)}">✕</button>`
                  ) : ''}
                </div>
              </td>`;
            }).join('');

            const armKey = 'entrydel:' + activeCollection + ':' + g.group;
            const isArmed = confirmTarget === armKey;
            return `
              <tr>
                <td><strong class="mono">${esc(g.group)}</strong></td>
                ${locCells}
                <td>
                  ${isArmed
                    ? `<button type="button" class="btn btn-sm btn-danger" data-entry-del-exec="${esc(activeCollection)}|${esc(g.group)}">${L('تأیید حذف گروه', 'Confirm Delete')}</button>
                       <button type="button" class="btn btn-sm" data-confirm-cancel="1">✕</button>`
                    : `<button type="button" class="btn btn-sm btn-danger" data-confirm-arm="${esc(armKey)}">${L('حذف', 'Delete')}</button>`
                  }
                </td>
              </tr>
            `;
          }).join('');

      return `
        <div class="subtabs">${pills}</div>

        <div class="card">
          <h3>${L('افزودن آیتم جدید در ', 'Create New Entry in ')}<span class="mono">${esc(activeCollection)}</span></h3>
          <div class="grid grid-4">
            <div class="field"><label>Group Key (lowercase slug) *</label><input id="new-entry-group" type="text" class="mono" placeholder="new-entry" /></div>
            <div class="field"><label>Title</label><input id="new-entry-title" type="text" placeholder="Title" /></div>
            <div class="field"><label>Slug (optional)</label><input id="new-entry-slug" type="text" class="mono" placeholder="auto" /></div>
            <div class="field"><label>Source Locale</label>
              <select id="new-entry-locale">${locs.map((l) => `<option value="${esc(l)}">${esc(l)}</option>`).join('')}</select>
            </div>
          </div>
          <div class="row">
            ${activeCollection === 'pages' ? `
              <select id="new-entry-preset" style="width:170px;">
                <option value="default">Standard Page</option>
                <option value="landing">Landing Preset</option>
              </select>
            ` : activeCollection === 'blog' ? `
              <input id="new-entry-cats" type="text" style="width:200px;" placeholder="categories (comma-sep)" />
              <input id="new-entry-tags" type="text" style="width:200px;" placeholder="tags (comma-sep)" />
            ` : `
              <input id="new-entry-desc" type="text" style="width:320px;" placeholder="description (optional)" />
            `}
            <label class="check-pill"><input id="new-entry-pub" type="checkbox" /><span>${L('انتشار فوری (--publish)', 'Publish (--publish)')}</span></label>
            <button type="button" class="btn btn-primary" data-action="create-entry">${L('ایجاد مطلب', 'Create Entry')}</button>
          </div>
        </div>

        <div class="card">
          <div class="between" style="margin-bottom:8px;">
            <h3>${esc(activeCollection)} <span class="badge">${groups.length} / ${rawGroups.length} groups</span> <span class="muted">base: /${esc(activeType.base || '')}</span></h3>
            <input id="content-search" type="text" style="width:240px;" placeholder="${L('فیلتر گروه، عنوان یا اسلاگ...', 'Filter group, title, slug...')}" value="${esc(contentSearch)}" />
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Group</th>${locs.map((l) => `<th class="mono">${esc(l)}</th>`).join('')}<th>Actions</th></tr>
              </thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    // ---------- Tab 5: Locales & Translation Matrix ----------
    let i18nAllowDraft = false;
    let i18nDeleteContent = false;

    function renderI18nTab() {
      const locs = state.locales.locales;
      const metaMap = state.locales.metadata || {};
      const defaultLoc = state.locales.defaultLocale;
      const coreByLoc = state.messages.coreByLocale || {};
      const clientByLoc = state.messages.clientByLocale || {};
      const mergedByLoc = state.messages.mergedByLocale || {};

      const locRows = locs.map((loc) => {
        const meta = metaMap[loc] || {};
        const isDef = loc === defaultLoc;
        const missing = state.messages.missingByLocale?.[loc] || 0;
        const todos = state.messages.todoByLocale?.[loc]?.length || 0;
        const delArm = 'locdel:' + loc;
        return `
          <tr>
            <td><strong class="mono">${esc(loc)}</strong> ${isDef ? '<span class="badge ok">default</span>' : ''}</td>
            <td>${esc(meta.name || loc)}</td>
            <td class="mono">${esc(meta.dir || 'ltr')}</td>
            <td class="mono">${esc(meta.htmlLang || loc)}</td>
            <td class="mono">${esc(meta.fontFamily || '')}</td>
            <td>
              ${missing ? `<span class="badge warn">${missing} missing</span>` : '<span class="badge ok">0 missing</span>'}
              ${todos ? `<span class="badge warn">${todos} TODO</span>` : ''}
            </td>
            <td>
              <div class="row">
                <button type="button" class="btn btn-sm" data-loc-edit="${esc(loc)}">${L('ویرایش متادیتا', 'Edit Meta')}</button>
                ${!isDef ? `<button type="button" class="btn btn-sm" data-cli="i18n:set-default" data-cli-code="${esc(loc)}">${L('پیش‌فرض', 'Set Default')}</button>` : ''}
                ${locs.length > 1 ? `<button type="button" class="btn btn-sm" data-cli="i18n:solo" data-cli-code="${esc(loc)}">${L('حالت تک‌زبان', 'Solo')}</button>` : ''}
                ${!isDef && locs.length > 1 ? (
                  confirmTarget === delArm
                    ? `<button type="button" class="btn btn-sm btn-danger" data-loc-del-exec="${esc(loc)}">${L('تأیید حذف', 'Confirm')}</button><button type="button" class="btn btn-sm" data-confirm-cancel="1">✕</button>`
                    : `<button type="button" class="btn btn-sm btn-danger" data-confirm-arm="${esc(delArm)}">${L('حذف', 'Remove')}</button>`
                ) : ''}
              </div>
            </td>
          </tr>
        `;
      }).join('');

      // Collect all message keys across all active locales
      const keySet = new Set();
      for (const loc of locs) {
        Object.keys(coreByLoc[loc] || {}).forEach((k) => keySet.add(k));
        Object.keys(mergedByLoc[loc] || {}).forEach((k) => keySet.add(k));
      }
      const allKeys = [...keySet].sort();
      const categories = [...new Set(allKeys.map((k) => (k.includes('_') ? k.split('_')[0] : 'other')))].sort();

      const filteredKeys = allKeys.filter((k) => {
        if (i18nFilterCategory !== 'all') {
          const cat = k.includes('_') ? k.split('_')[0] : 'other';
          if (cat !== i18nFilterCategory) return false;
        }
        const vals = locs.map((l) => {
          const rawVal = msgDirty[l] && k in msgDirty[l] ? msgDirty[l][k] : mergedByLoc[l]?.[k];
          if (Array.isArray(rawVal)) return JSON.stringify(rawVal);
          return String(rawVal ?? '');
        });
        if (i18nFilterStatus === 'todo') {
          if (!vals.some((v) => v.includes('[TODO:'))) return false;
        } else if (i18nFilterStatus === 'client') {
          if (!locs.some((l) => k in (clientByLoc[l] || {}))) return false;
        } else if (i18nFilterStatus === 'missing') {
          if (!vals.some((v) => v.trim() === '' || v === '[]')) return false;
        }
        if (i18nSearch.trim()) {
          const q = i18nSearch.trim().toLowerCase();
          const matchKey = k.toLowerCase().includes(q);
          const matchVal = vals.some((v) => v.toLowerCase().includes(q));
          if (!matchKey && !matchVal) return false;
        }
        return true;
      });

      const pageCount = Math.max(1, Math.ceil(filteredKeys.length / i18nPageSize));
      if (i18nPage >= pageCount) i18nPage = pageCount - 1;
      const slice = filteredKeys.slice(i18nPage * i18nPageSize, (i18nPage + 1) * i18nPageSize);

      const matrixRows = slice.map((k) => {
        const isCore = locs.some((l) => k in (coreByLoc[l] || {}));
        const isDeleted = msgDeleteQueue.has(k);
        const cells = locs.map((loc) => {
          const dir = metaMap[loc]?.dir || 'ltr';
          const baseVal = mergedByLoc[loc]?.[k] ?? '';
          const curVal = msgDirty[loc] && k in msgDirty[loc] ? msgDirty[loc][k] : baseVal;
          const isClient = k in (clientByLoc[loc] || {});
          const isDirty = msgDirty[loc] && k in msgDirty[loc];
          const displayVal = curVal === null ? (coreByLoc[loc]?.[k] ?? '') : curVal;
          const isArrayVal = Array.isArray(displayVal);
          const textVal = isArrayVal ? JSON.stringify(displayVal) : String(displayVal ?? '');
          return `
            <td>
              <input type="text" dir="${esc(dir)}"
                style="${isDirty ? 'border-color:var(--primary);' : textVal.includes('[TODO:') ? 'border-color:var(--warn);' : ''}"
                data-msg-cell="${esc(loc)}|${esc(k)}"
                data-msg-array="${isArrayVal ? '1' : '0'}"
                value="${esc(textVal)}" />
              ${isClient && isCore ? `<button type="button" class="btn btn-sm" style="margin-top:3px;" data-msg-revert="${esc(loc)}|${esc(k)}">↺ core</button>` : ''}
            </td>
          `;
        }).join('');

        return `
          <tr style="${isDeleted ? 'opacity:0.45;' : ''}">
            <td>
              <div class="mono" style="font-size:12px;"><strong>${esc(k)}</strong></div>
              <span class="badge">${isCore ? 'core' : 'custom'}</span>
            </td>
            ${cells}
            <td>
              ${!isCore ? `<button type="button" class="btn btn-sm btn-danger" data-msg-del-key="${esc(k)}">${isDeleted ? '↺' : '✕'}</button>` : ''}
            </td>
          </tr>
        `;
      }).join('');

      const dirtyCount = Object.values(msgDirty).reduce((acc, m) => acc + Object.keys(m).length, 0) + msgDeleteQueue.size;

      return `
        <div class="card">
          <div class="between" style="margin-bottom:8px;">
            <h3>${L('زبان‌های فعال (client/locales.json)', 'Active Locales (client/locales.json)')}</h3>
            <div class="row">
              <label class="check-pill"><input id="i18n-opt-draft" type="checkbox" ${i18nAllowDraft ? 'checked' : ''} /><span>--allow-draft</span></label>
              <label class="check-pill"><input id="i18n-opt-delcontent" type="checkbox" ${i18nDeleteContent ? 'checked' : ''} /><span>${L('حذف دائم فایل‌های محتوا به جای آرشیو', '--delete-content (instead of archive)')}</span></label>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Locale</th><th>Name</th><th>Dir</th><th>htmlLang</th><th>Font</th><th>Keys Status</th><th>Actions</th></tr></thead>
              <tbody>${locRows}</tbody>
            </table>
          </div>
        </div>

        <div class="grid grid-2">
          <div class="card">
            <h3>${L('افزودن زبان جدید (i18n:add-lang)', 'Add Language (i18n:add-lang)')}</h3>
            <div class="grid grid-2">
              <div class="field"><label>Code * (e.g. ar, de, fr)</label><input id="add-lang-code" type="text" class="mono" placeholder="ar" /></div>
              <div class="field"><label>Display Name</label><input id="add-lang-name" type="text" placeholder="العربية" /></div>
              <div class="field"><label>Direction</label><select id="add-lang-dir"><option value="ltr">ltr</option><option value="rtl">rtl</option></select></div>
              <div class="field"><label>Clone Content From</label><select id="add-lang-from">${locs.map((l) => `<option value="${esc(l)}">${esc(l)}</option>`).join('')}</select></div>
              <div class="field"><label>htmlLang (optional)</label><input id="add-lang-htmllang" type="text" class="mono" placeholder="auto" /></div>
              <div class="field"><label>fontFamily (optional)</label><input id="add-lang-font" type="text" class="mono" placeholder="var(--font-sans)" /></div>
            </div>
            <div class="row" style="margin-bottom:10px;">
              <label class="check-pill"><input id="add-lang-content" type="checkbox" checked /><span>--with-content</span></label>
              <label class="check-pill"><input id="add-lang-pub" type="checkbox" /><span>--publish</span></label>
            </div>
            <button type="button" class="btn btn-primary" data-action="add-lang">${L('افزودن زبان', 'Add Language')}</button>
          </div>

          <div class="card">
            <h3>${L('همگام‌سازی و افزودن کلید جدید (i18n:add)', 'Sync Missing Keys & Add Custom Key')}</h3>
            <div class="row" style="margin-bottom:12px;">
              <button type="button" class="btn" data-cli="i18n:sync-keys" data-cli-dry="1">i18n:sync-keys (Dry-Run)</button>
              <button type="button" class="btn btn-accent" data-cli="i18n:sync-keys">i18n:sync-keys</button>
              <button type="button" class="btn" data-cli="messages:compile">messages:compile</button>
            </div>
            <div class="divider"></div>
            <div class="grid grid-2">
              <div class="field"><label>Category (e.g. hero, custom)</label><input id="add-key-cat" type="text" class="mono" value="custom" /></div>
              <div class="field"><label>Key Name * (e.g. cta_note)</label><input id="add-key-name" type="text" class="mono" placeholder="cta_note" /></div>
            </div>
            <div class="grid grid-2">
              ${locs.map((l) => `<div class="field"><label>${esc(l)}</label><input type="text" data-add-key-loc="${esc(l)}" /></div>`).join('')}
            </div>
            <button type="button" class="btn btn-primary" data-action="add-i18n-key">${L('افزودن کلید به دیکشنری', 'Add Dictionary Key')}</button>
          </div>
        </div>

        <div class="card" style="margin-top:14px;">
          <div class="between" style="margin-bottom:10px;">
            <div>
              <h3>${L('ماتریس ویرایش ترجمه‌ها (client/messages/*.json)', 'Interactive Translation Dictionary Matrix')}</h3>
              <span class="muted">${filteredKeys.length} / ${allKeys.length} keys</span>
            </div>
            <div class="row">
              <input id="i18n-search" type="text" style="width:200px;" placeholder="${L('جستجو در کلید یا متن...', 'Search key or value...')}" value="${esc(i18nSearch)}" />
              <select id="i18n-status-filter" style="width:140px;">
                <option value="all" ${i18nFilterStatus === 'all' ? 'selected' : ''}>All Keys</option>
                <option value="todo" ${i18nFilterStatus === 'todo' ? 'selected' : ''}>Has [TODO:]</option>
                <option value="client" ${i18nFilterStatus === 'client' ? 'selected' : ''}>Client Overridden</option>
                <option value="missing" ${i18nFilterStatus === 'missing' ? 'selected' : ''}>Empty / Missing</option>
              </select>
              <select id="i18n-cat-filter" style="width:130px;">
                <option value="all">All Categories</option>
                ${categories.map((cat) => `<option value="${esc(cat)}" ${i18nFilterCategory === cat ? 'selected' : ''}>${esc(cat)}</option>`).join('')}
              </select>
              <select id="i18n-page-size" style="width:90px;">
                ${[25, 50, 100, 200].map((n) => `<option value="${n}" ${i18nPageSize === n ? 'selected' : ''}>${n} / pg</option>`).join('')}
              </select>
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr><th style="width:22%;">Key</th>${locs.map((l) => `<th class="mono">${esc(l)}</th>`).join('')}<th></th></tr>
              </thead>
              <tbody>${matrixRows}</tbody>
            </table>
          </div>

          <div class="between" style="margin-top:10px;">
            <div class="row">
              <button type="button" class="btn btn-sm" data-i18n-page="${Math.max(0, i18nPage - 1)}" ${i18nPage === 0 ? 'disabled' : ''}>← Prev</button>
              <span class="muted mono">${i18nPage + 1} / ${pageCount}</span>
              <button type="button" class="btn btn-sm" data-i18n-page="${Math.min(pageCount - 1, i18nPage + 1)}" ${i18nPage >= pageCount - 1 ? 'disabled' : ''}>Next →</button>
            </div>
            <div class="row">
              ${dirtyCount > 0 ? `<span class="badge warn">${dirtyCount} ${L('تغییر ذخیره‌نشده', 'unsaved edits')}</span><button type="button" class="btn btn-sm" data-action="discard-messages">${L('لغو تغییرات', 'Discard')}</button>` : ''}
              <button type="button" class="btn btn-primary" data-action="save-messages" ${dirtyCount === 0 ? 'disabled' : ''}>${L('ذخیره ترجمه‌ها و کامپایل Paraglide', 'Save & Compile Translations')}</button>
            </div>
          </div>
        </div>
      `;
    }

             ` : `<span class="badge">starter-kit not present</span>`}
             ${confirmTarget === 'tools:reset'
               ? `<button type="button" class="btn btn-danger" data-cli="site:reset">${L('تأیید ریست کامل کانفیگ', 'Confirm site:reset')}</button>
                  <button type="button" class="btn btn-sm" data-confirm-cancel="1">✕</button>`
               : `<button type="button" class="btn btn-danger" data-confirm-arm="tools:reset">site:reset</button>`
             }`
          )}

      `;

    // ---------- Modals ----------
    function renderModal() {
      const card = document.getElementById('modal-card');
      if (!modalState) return;
      const locs = state.locales.locales;

      if (modalState.type === 'entry') {
        const d = modalState.data;
        const fm = d.frontmatter;
        const col = d.collection;
        const typeDef = (state.contentTypes || []).find((x) => x.key === col) || {};
        const customFields = typeDef.fields || [];
        const knownKeys = new Set(['title', 'slug', 'description', 'draft', 'image', 'hero', 'container', 'flushTop', 'template', 'sections', 'publishedAt', 'updatedAt', 'author', 'categories', 'tags', 'client', 'year', 'link', 'stack', ...customFields.map((f) => f.name)]);
        const extraFm = Object.fromEntries(Object.entries(fm).filter(([k]) => !knownKeys.has(k)));

        const customInputs = customFields.map((f) => {
          const val = fm[f.name];
          const reqMark = f.required ? ' *' : '';
          if (f.type === 'boolean') {
            return `<div class="field"><label>${esc(f.label || f.name)}${reqMark}</label><label class="check-pill"><input type="checkbox" data-efm-custom-bool="${esc(f.name)}" ${val ? 'checked' : ''} /><span>${esc(f.name)}</span></label></div>`;
          }
          if (f.type === 'enum') {
            return `<div class="field"><label>${esc(f.label || f.name)}${reqMark}</label>
              <select data-efm-custom="${esc(f.name)}">
                <option value="">(none)</option>
                ${(f.options || []).map((o) => `<option value="${esc(o)}" ${val === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}
              </select></div>`;
          }
          if (f.type === 'string[]' || f.type === 'taxonomy[]') {
            return `<div class="field"><label>${esc(f.label || f.name)}${reqMark} (comma-sep)</label><input type="text" data-efm-custom-list="${esc(f.name)}" value="${esc(Array.isArray(val) ? val.join(', ') : (val || ''))}" /></div>`;
          }
          if (f.type === 'text') {
            return `<div class="field"><label>${esc(f.label || f.name)}${reqMark}</label><textarea data-efm-custom="${esc(f.name)}">${esc(val ?? '')}</textarea></div>`;
          }
          if (f.type === 'number') {
            const minAttr = f.min !== undefined && f.min !== '' ? `min="${esc(f.min)}"` : '';
            const maxAttr = f.max !== undefined && f.max !== '' ? `max="${esc(f.max)}"` : '';
            return `<div class="field"><label>${esc(f.label || f.name)}${reqMark}</label><input type="number" step="any" ${minAttr} ${maxAttr} class="mono" data-efm-custom-num="${esc(f.name)}" value="${esc(val ?? '')}" /></div>`;
