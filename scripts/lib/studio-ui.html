<!doctype html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Astro Starter Studio — Setup & CLI Control Panel</title>
  <style>
    :root {
      --bg: #0b0f17;
      --surface: #121826;
      --surface-2: #192234;
      --border: #27344d;
      --text: #eef2f8;
      --muted: #93a4bf;
      --primary: #4f7cff;
      --primary-fg: #ffffff;
      --accent: #10b981;
      --warn: #f59e0b;
      --danger: #ef4444;
      --radius: 12px;
      --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Vazirmatn', Tahoma, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    html[data-theme="light"] {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --surface-2: #eef2f8;
      --border: #d5deec;
      --text: #0f172a;
      --muted: #52637d;
      --primary: #3b5bdb;
      --primary-fg: #ffffff;
      --accent: #059669;
      --warn: #d97706;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.55;
    }
    a { color: var(--primary); text-decoration: none; }
    button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
    code, pre, .mono { font-family: var(--mono); direction: ltr; unicode-bidi: isolate; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand-title { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600;
      background: var(--surface-2); border: 1px solid var(--border); color: var(--muted);
    }
    .badge.ok { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
    .badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
    .badge.err { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
    .topbar-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .shell { max-width: 1320px; margin: 0 auto; padding: 18px 20px 110px; }
    .tabs {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
    }
    .tab-btn {
      padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--surface); color: var(--muted); cursor: pointer; font-weight: 600;
      transition: all 0.15s ease;
    }
    .tab-btn:hover { border-color: var(--primary); color: var(--text); }
    .tab-btn.active { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
    .grid { display: grid; gap: 14px; }
    .grid-2 { grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); }
    .grid-3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px;
    }
    .card h2, .card h3 { margin: 0 0 8px; font-size: 15px; }
    .card-sub { color: var(--muted); font-size: 12.5px; margin: 0 0 12px; }
    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
    .field label { font-size: 12px; font-weight: 600; color: var(--muted); }
    input[type="text"], input[type="email"], input[type="url"], input[type="number"], select, textarea {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      border-radius: 8px; padding: 8px 10px; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    textarea { min-height: 92px; resize: vertical; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .between { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 13px; border-radius: 9px; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--text); cursor: pointer; font-weight: 600; font-size: 13px;
    }
    .btn:hover:not(:disabled) { border-color: var(--primary); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
    .btn-accent { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-danger { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, transparent); }
    .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 7px; }
    .bp-card {
      text-align: start; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg); cursor: pointer; display: flex; flex-direction: column; gap: 5px;
    }
    .bp-card:hover { border-color: var(--primary); }
    .bp-card.selected { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 13%, var(--bg)); }
    .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.25); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: start; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { font-size: 11.5px; color: var(--muted); font-weight: 600; }
    .sec-item {
      border: 1px solid var(--border); background: var(--bg); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
    }
    .console-dock {
      position: fixed; bottom: 0; inset-inline: 0; z-index: 45;
      background: var(--surface); border-top: 1px solid var(--border);
      box-shadow: 0 -8px 28px rgba(0,0,0,0.32);
    }
    .console-bar {
      max-width: 1320px; margin: 0 auto; padding: 8px 20px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer;
    }
    .console-body {
      max-width: 1320px; margin: 0 auto; padding: 0 20px 14px;
      max-height: 250px; overflow: auto;
    }
    .console-pre {
      margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--bg);
      border: 1px solid var(--border); font-size: 12px; white-space: pre-wrap; word-break: break-word;
    }
    .check-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px;
      border-radius: 8px; border: 1px solid var(--border); background: var(--bg); font-size: 12.5px; cursor: pointer;
    }
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.62);
      display: flex; align-items: center; justify-content: center; padding: 18px;
    }
    .modal-card {
      width: min(860px, 100%); max-height: 88vh; overflow: auto;
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px;
    }
    .hidden { display: none !important; }
    .toast {
      position: fixed; top: 68px; inset-inline-end: 20px; z-index: 70;
      padding: 10px 14px; border-radius: 10px; background: var(--surface-2);
      border: 1px solid var(--primary); box-shadow: 0 10px 25px rgba(0,0,0,0.3); font-weight: 600;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand-title">
      <span id="ui-brand-name">Astro Starter Studio</span>
      <span id="ui-site-badge" class="badge">...</span>
      <span id="ui-locales-badge" class="badge">...</span>
      <span id="ui-missing-badge" class="badge hidden"></span>
    </div>
    <div class="topbar-actions">
      <a id="ui-preview-link" class="btn btn-sm hidden" target="_blank" rel="noopener">Preview ↗</a>
      <button id="btn-refresh" type="button" class="btn btn-sm">↻ Refresh</button>
      <button id="btn-lang" type="button" class="btn btn-sm">EN / فا</button>
      <button id="btn-theme" type="button" class="btn btn-sm">☀ / ☾</button>
    </div>
  </header>

  <main class="shell">
    <nav id="tabs-nav" class="tabs"></nav>
    <section id="tab-content"></section>
  </main>

  <div id="modal-root" class="modal-backdrop hidden">
    <div class="modal-card" id="modal-card"></div>
  </div>
  <div id="toast-root" class="toast hidden"></div>

  <footer class="console-dock">
    <div class="console-bar" id="console-toggle">
      <div class="row">
        <strong id="console-label">Console Output</strong>
        <span id="console-status" class="badge">Ready</span>
      </div>
      <div class="row">
        <button id="console-clear" type="button" class="btn btn-sm">Clear</button>
        <span id="console-chevron">▲</span>
      </div>
    </div>
    <div id="console-body" class="console-body hidden">
      <pre id="console-pre" class="console-pre">No command executed yet.</pre>
    </div>
  </footer>

  <script>
    const BOOT = __STUDIO_BOOT_JSON__;

    const COPY = {
      fa: {
        brand: 'استودیو راه‌اندازی Astro Starter',
        preview: 'پیش‌نمایش سایت ↗',
        refresh: '↻ تازه‌سازی',
        tabs: {
          wizard: '۱. راه‌انداز سایت جدید',
          config: '۲. تنظیمات و ناوبری',
          content: '۳. صفحات و محتوا',
          i18n: '۴. زبان‌ها و دیکشنری',
          tools: '۵. ابزارهای CLI و تست',
        },
        consoleTitle: 'خروجی دستورات و لاگ',
        ready: 'آماده',
        running: 'در حال اجرا...',
        clear: 'پاک کردن',
        dryRun: 'پیش‌نمایش تغییرات (Dry-Run)',
        applySpec: 'اعمال و ساخت سایت (site:apply)',
        saveConfig: 'ذخیره در client/config.json',
        missingKeys: 'کلید ترجمه جاافتاده',
      },
      en: {
        brand: 'Astro Starter Studio',
        preview: 'Preview Site ↗',
        refresh: '↻ Refresh',
        tabs: {
          wizard: '1. New Site Wizard',
          config: '2. Config & Navigation',
          content: '3. Pages & Content',
          i18n: '4. Languages & i18n',
          tools: '5. CLI Tools & Checks',
        },
        consoleTitle: 'Command Output',
        ready: 'Ready',
        running: 'Running...',
        clear: 'Clear',
        dryRun: 'Preview Changes (Dry-Run)',
        applySpec: 'Apply Site Setup (site:apply)',
        saveConfig: 'Save client/config.json',
        missingKeys: 'missing i18n keys',
      },
    };

    const STARTER_PAGES = [
      { group: 'about', enTitle: 'About Us', faTitle: 'درباره ما', enSlug: 'about', faSlug: 'درباره-ما', icon: 'info' },
      { group: 'features', enTitle: 'Features', faTitle: 'امکانات', enSlug: 'features', faSlug: 'امکانات', icon: 'sparkles' },
      { group: 'pricing', enTitle: 'Pricing', faTitle: 'تعرفه‌ها', enSlug: 'pricing', faSlug: 'تعرفه‌ها', icon: 'tag' },
      { group: 'contact', enTitle: 'Contact Us', faTitle: 'تماس با ما', enSlug: 'contact', faSlug: 'تماس-با-ما', icon: 'mail' },
      { group: 'privacy', enTitle: 'Privacy Policy', faTitle: 'حریم خصوصی', enSlug: 'privacy', faSlug: 'حریم-خصوصی', icon: 'shield' },
      { group: 'terms', enTitle: 'Terms of Service', faTitle: 'قوانین استفاده', enSlug: 'terms', faSlug: 'قوانین', icon: 'file' },
    ];

    const DEFAULT_BLOCK_PROPS = {
      LandingHeroSplit: {
        eyebrow: 'New Launch',
        titleLead: 'Build Modern Multilingual Sites',
        titleAccent: 'Fast',
        description: 'RTL-native Astro v7 starter configured via Studio.',
        primaryCta: { label: 'Get Started', href: '/contact/', icon: 'arrow-right' },
      },
      HeroCenteredEditorial: {
        eyebrow: 'Studio Edition',
        titleLead: 'Clean Editorial',
        titleAccent: 'Presence',
        description: 'Fast static delivery across RTL and LTR languages.',
        primaryCta: { label: 'Explore', href: '/about/' },
      },
      ProofStatsRow: { surface: 'surface', spacing: 'md' },
      BentoCapabilities: {
        title: 'Core Capabilities',
        description: 'Everything configured cleanly through declarative sections.',
        surface: 'default',
        spacing: 'lg',
      },
      FeatureCardGrid: {
        title: 'Key Features',
        columns: 3,
        items: [
          { title: 'Fast Static SSG', description: 'Zero runtime bloat.', icon: 'bolt' },
          { title: 'RTL & LTR Native', description: 'Logical Tailwind v4 CSS.', icon: 'globe' },
          { title: 'SEO & Search Ready', description: 'JSON-LD + Pagefind built in.', icon: 'search' },
        ],
      },
      FaqAccordion: {
        title: 'Frequently Asked Questions',
        items: [
          { question: 'How is content managed?', answer: 'Directly via localized MDX files and Pages CMS.' },
        ],
      },
      LatestPostsSection: { limit: 3, surface: 'default', spacing: 'lg' },
      CtaBanner: {
        title: 'Ready to launch your site?',
        description: 'Contact our team today to get started.',
        primaryCta: { label: 'Contact Us', href: '/contact/', icon: 'arrow-right' },
        surface: 'hero',
        spacing: 'md',
      },
    };

    let uiLang = localStorage.getItem('studio_lang') || 'fa';
    let activeTab = localStorage.getItem('studio_tab') || 'wizard';
    let state = null;
    let wizardDraft = null;
    let configDraft = null;
    let busy = false;
    let pendingConfirmKey = '';

    function esc(v) {
      return String(v ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function t() {
      return COPY[uiLang] || COPY.fa;
    }

    function showToast(msg) {
      const el = document.getElementById('toast-root');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(el._timer);
      el._timer = setTimeout(() => el.classList.add('hidden'), 3200);
    }

    function logConsole(label, text, ok = true, durationMs = null) {
      const status = document.getElementById('console-status');
      const lbl = document.getElementById('console-label');
      const pre = document.getElementById('console-pre');
      const body = document.getElementById('console-body');
      const chev = document.getElementById('console-chevron');

      lbl.textContent = label + (durationMs !== null ? ' (' + durationMs + ' ms)' : '');
      status.textContent = ok ? 'OK' : 'ERROR';
      status.className = 'badge ' + (ok ? 'ok' : 'err');
      pre.textContent = text || (ok ? 'Completed successfully.' : 'Command failed.');
      body.classList.remove('hidden');
      chev.textContent = '▼';
    }

    async function api(url, method = 'GET', body = null) {
      const opts = { method, headers: {} };
      if (body !== null) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(body);
      }
      const res = await fetch(url, opts);
      const json = await res.json().catch(() => ({ ok: false, error: 'Invalid server response' }));
      if (!res.ok || json.ok === false) {
        const err = new Error(json.error || 'Request failed');
        err.output = json.output || json.error;
        throw err;
      }
      return json;
    }

    function initDraftsFromState() {
      const cfg = state.config;
      const defaultLoc = state.locales.defaultLocale || 'en';

      if (!wizardDraft) {
        wizardDraft = {
          blueprint: 'corporate',
          site: {
            name: cfg.site?.name || '',
            shortName: cfg.site?.shortName || '',
            description: cfg.site?.description || '',
            url: cfg.site?.url || '',
            contactEmail: cfg.site?.contactEmail || '',
          },
          brand: {
            preset: cfg.brand?.preset || 'indigo',
            primaryColor: cfg.brand?.primaryColor || '',
            accentColor: cfg.brand?.accentColor || '',
            fontPreset: cfg.brand?.fontPreset || 'system',
            rtlFontPreset: cfg.brand?.rtlFontPreset || 'vazirmatn',
            socialCardMode: cfg.brand?.socialCardMode || 'branded',
            defaultTheme: cfg.brand?.defaultTheme || 'system',
            logo: {
              light: cfg.brand?.logo?.light || '',
              dark: cfg.brand?.logo?.dark || '',
              alt: cfg.brand?.logo?.alt || cfg.site?.name || '',
              showText: cfg.brand?.logo?.showText !== false,
            },
          },
          locale: {
            defaultLocale: defaultLoc,
            solo: false,
          },
          homeSections: Array.isArray(cfg.ui?.homeSections)
            ? JSON.parse(JSON.stringify(cfg.ui.homeSections))
            : [],
          selectedPages: {
            about: true,
            features: false,
            pricing: false,
            contact: true,
            privacy: false,
            terms: false,
          },
          pageDrafts: Object.fromEntries(
            STARTER_PAGES.map((p) => [
              p.group,
              {
                enTitle: p.enTitle,
                faTitle: p.faTitle,
                enSlug: p.enSlug,
                faSlug: p.faSlug,
                nav: true,
                publish: true,
              },
            ])
          ),
          skipAssets: true,
          disableTopBanner: true,
        };
      }

      configDraft = JSON.parse(JSON.stringify(cfg));
    }

    function buildSiteSpecFromWizard() {
      const w = wizardDraft;
      const activeLocales = state.locales.locales;
      const pages = {};

      for (const p of STARTER_PAGES) {
        if (!w.selectedPages[p.group]) continue;
        const d = w.pageDrafts[p.group];
        const locales = {};
        for (const loc of activeLocales) {
          if (loc === 'fa') {
            locales.fa = {
              title: d.faTitle || p.faTitle,
              slug: d.faSlug || p.faSlug,
              draft: !d.publish,
            };
          } else {
            locales[loc] = {
              title: d.enTitle || p.enTitle,
              slug: loc === w.locale.defaultLocale ? (d.enSlug || p.enSlug) : (d.enSlug || p.group) + '-' + loc,
              draft: !d.publish,
            };
          }
        }
        pages[p.group] = {
          hero: 'default',
          container: 'contained',
          publish: d.publish,
          nav: d.nav ? { icon: p.icon } : undefined,
          locales,
        };
      }

      const brandOut = {
        preset: w.brand.preset,
        fontPreset: w.brand.fontPreset,
        rtlFontPreset: w.brand.rtlFontPreset,
        socialCardMode: w.brand.socialCardMode,
        defaultTheme: w.brand.defaultTheme,
        logo: {
          alt: w.brand.logo.alt || w.site.name || 'Logo',
          showText: Boolean(w.brand.logo.showText),
          ...(w.brand.logo.light ? { light: w.brand.logo.light } : {}),
          ...(w.brand.logo.dark ? { dark: w.brand.logo.dark } : {}),
        },
      };
      if (w.brand.primaryColor && /^#[0-9a-fA-F]{6}$/.test(w.brand.primaryColor)) {
        brandOut.primaryColor = w.brand.primaryColor;
      }
      if (w.brand.accentColor && /^#[0-9a-fA-F]{6}$/.test(w.brand.accentColor)) {
        brandOut.accentColor = w.brand.accentColor;
      }

      const uiOut = {};
      if (w.disableTopBanner) {
        uiOut.topBanner = { enabled: false };
      }
      if (Array.isArray(w.homeSections) && w.homeSections.length > 0) {
        uiOut.homeSections = w.homeSections;
      }

      return {
        blueprint: w.blueprint || undefined,
        site: {
          name: w.site.name || 'My Site',
          shortName: w.site.shortName || w.site.name || 'My Site',
          description: w.site.description || 'Built with Astro Starter',
          ...(w.site.url ? { url: w.site.url } : {}),
          ...(w.site.contactEmail ? { contactEmail: w.site.contactEmail } : {}),
        },
        brand: brandOut,
        ...(Object.keys(uiOut).length ? { ui: uiOut } : {}),
        locale: {
          defaultLocale: w.locale.defaultLocale,
          solo: Boolean(w.locale.solo),
          allowDraft: true,
        },
        ...(Object.keys(pages).length ? { pages } : {}),
      };
    }

    async function loadState(resetConfigDraft = true) {
      const data = await api('api/state');
      state = data;
      if (resetConfigDraft) configDraft = null;
      initDraftsFromState();
      renderChrome();
      renderActiveTab();
    }

    async function runCli(action, payload = {}, label = action) {
      if (busy) return;
      busy = true;
      const status = document.getElementById('console-status');
      status.textContent = t().running;
      status.className = 'badge warn';
      try {
        const res = await api('api/run-cli', 'POST', { action, payload });
        logConsole(label, res.output || 'Done.', true, res.durationMs);
        showToast(label + ' ✓');
        await loadState(true);
      } catch (err) {
        logConsole(label, err.output || err.message, false);
        showToast(label + ' ✕');
      } finally {
        busy = false;
      }
    }

    function renderChrome() {
      const isFa = uiLang === 'fa';
      document.documentElement.lang = isFa ? 'fa' : 'en';
      document.documentElement.dir = isFa ? 'rtl' : 'ltr';
      document.getElementById('ui-brand-name').textContent = t().brand;
      document.getElementById('btn-refresh').textContent = t().refresh;
      document.getElementById('console-label').textContent = t().consoleTitle;
      document.getElementById('console-clear').textContent = t().clear;

      const prevEl = document.getElementById('ui-preview-link');
      if (BOOT.sitePreviewHref) {
        prevEl.href = BOOT.sitePreviewHref;
        prevEl.textContent = t().preview;
        prevEl.classList.remove('hidden');
      }

      if (state) {
        document.getElementById('ui-site-badge').textContent =
          (state.config.site?.name || 'Site') + ' · ' + (state.config.brand?.preset || '');
        document.getElementById('ui-locales-badge').textContent =
          state.locales.locales.join(', ') + ' (' + state.locales.defaultLocale + ')';

        const missEl = document.getElementById('ui-missing-badge');
        if (state.messages.missingTotal > 0) {
          missEl.textContent = state.messages.missingTotal + ' ' + t().missingKeys;
          missEl.className = 'badge warn';
          missEl.classList.remove('hidden');
        } else {
          missEl.classList.add('hidden');
        }
      }

      const nav = document.getElementById('tabs-nav');
      nav.innerHTML = Object.entries(t().tabs)
        .map(
          ([id, label]) =>
            '<button type="button" class="tab-btn ' +
            (activeTab === id ? 'active' : '') +
            '" data-tab="' +
            id +
            '">' +
            esc(label) +
            '</button>'
        )
        .join('');
    }

    function renderSectionArrayEditor(containerId, sectionsArr, onUpdateName) {
      const blockOptions = state.sectionBlocks
        .map((b) => '<option value="' + esc(b.name) + '">' + esc(b.name) + ' (' + esc(b.category) + ')</option>')

    function renderContentTab() {
      const isFa = uiLang === 'fa';
      const locs = state.locales.locales;

      const typeRows = state.contentTypes
        .map((ct) => {
          const isPages = ct.key === 'pages';
          return (
            '<tr>' +
            '<td><strong>' + esc(ct.key) + '</strong> <span class="badge">' + esc(ct.source || 'core') + '</span></td>' +
            '<td class="mono">/' + esc(ct.base) + '/</td>' +
            '<td><span class="badge ' + (ct.enabled ? 'ok' : 'warn') + '">' + (ct.enabled ? 'enabled' : 'disabled') + '</span></td>' +
            '<td>' +
            (isPages
              ? '<span class="card-sub">Core</span>'

            '</td></tr>'
          );
        })
        .join('');

      const pageRows = state.pages
        .map((pg) => {
          const cells = locs
            .map((l) => {
              const info = pg.locales[l];
              if (!info) return '<td><span class="badge">missing</span></td>';
              const secCount = info.sections?.length || 0;
              return (
                '<td>' +
                '<div><strong>' + esc(info.title || '(untitled)') + '</strong></div>' +
                '<div class="mono" style="font-size:11px;color:var(--muted)">/' + esc(info.slug) + ' · ' + esc(info.hero) + '/' + esc(info.container) + '</div>' +
                '<div class="row" style="margin-top:4px">' +
                '<span class="badge ' + (info.draft ? 'warn' : 'ok') + '">' + (info.draft ? 'draft' : 'published') + '</span>' +
                (secCount ? '<span class="badge">' + secCount + ' sections</span>' : '') +
                '<button type="button" class="btn btn-sm" data-edit-sections="' + esc(pg.group) + ':' + esc(l) + '">' + (isFa ? 'سکشن‌ها' : 'Sections') + '</button>' +

          const delBtn =
            pg.group === 'home'
              ? ''
              : '<button type="button" class="btn btn-sm btn-danger" data-del-page="' + esc(pg.group) + '">' + (isFa ? 'حذف' : 'Delete') + '</button>';
          return '<tr><td><strong>' + esc(pg.group) + '</strong></td>' + cells + '<td>' + delBtn + '</td></tr>';
        })

      const nonPageTypes = state.contentTypes.filter((ct) => ct.key !== 'pages');

        '<div class="grid grid-2">' +
        '<div class="card">' +
        '<h3>' + (isFa ? 'ساخت صفحه جدید (`new:page`)' : 'Create Page (`new:page`)') + '</h3>' +

        '<div class="card">' +
        '<h3>' + (isFa ? 'همگام‌سازی خودکار و افزودن کلید (`i18n:sync-keys` / `i18n:add`)' : 'Dictionary Sync & Quick Key') + '</h3>' +
        '<div style="margin-bottom:10px">' +

    function renderActiveTab() {
      const el = document.getElementById('tab-content');
      if (!state) return;
      if (activeTab === 'wizard') el.innerHTML = renderWizardTab();
      else if (activeTab === 'config') el.innerHTML = renderConfigTab();
      else if (activeTab === 'content') el.innerHTML = renderContentTab();
      else if (activeTab === 'i18n') el.innerHTML = renderI18nTab();
      else if (activeTab === 'tools') el.innerHTML = renderToolsTab();
    }

    function openPageSectionsModal(group, locale) {
      const pg = state.pages.find((p) => p.group === group);
      const info = pg?.locales?.[locale];
      if (!info) return;

      let localSections = JSON.parse(JSON.stringify(info.sections || []));
      let heroVal = info.hero === true ? 'default' : info.hero === false ? 'none' : info.hero || 'none';
      let containerVal = info.container || 'canvas';
      let flushTopVal = Boolean(info.flushTop);

      const modal = document.getElementById('modal-root');
      const card = document.getElementById('modal-card');
      modal._sectionsState = {
        get: () => localSections,
        set: (arr) => {
          localSections = arr;
          draw();
        },
      };

      const draw = () => {
        card.innerHTML =
          '<div class="between" style="margin-bottom:12px">' +
          '<h2 style="margin:0">' + esc(group) + ' (' + esc(locale) + ') — Section Composer</h2>' +
          '<button type="button" class="btn btn-sm" id="modal-close">✕</button></div>' +
          '<div class="grid grid-3" style="margin-bottom:12px">' +
          '<div class="field"><label>hero</label><select id="m-hero">' +
          ['none', 'minimal', 'default'].map((h) => '<option value="' + h + '" ' + (heroVal === h ? 'selected' : '') + '>' + h + '</option>').join('') +
          '</select></div>' +
          '<div class="field"><label>container</label><select id="m-container">' +
          ['canvas', 'contained', 'prose'].map((c) => '<option value="' + c + '" ' + (containerVal === c ? 'selected' : '') + '>' + c + '</option>').join('') +
          '</select></div>' +
          '<div class="field"><label>flushTop</label><label class="check-pill"><input type="checkbox" id="m-flushtop" ' + (flushTopVal ? 'checked' : '') + ' />flushTop</label></div>' +
          '</div>' +
          renderSectionArrayEditor('modal-sec-ed', localSections, 'pageModal') +
          '<div class="row" style="justify-content:flex-end;margin-top:14px">' +
          '<button type="button" class="btn btn-primary" id="modal-save-sections">Save Page Frontmatter</button>' +
          '</div>';
      };

      draw();
      modal.classList.remove('hidden');

      card.onclick = async (e) => {
        const target = e.target;
        if (!(target instanceof HTMLElement)) return;
        if (target.id === 'modal-close') {
          modal.classList.add('hidden');
          return;
        }
        if (target.id === 'modal-save-sections') {
          heroVal = document.getElementById('m-hero').value;
          containerVal = document.getElementById('m-container').value;
          flushTopVal = document.getElementById('m-flushtop').checked;
          try {
            // Sync textarea JSON props before saving
            card.querySelectorAll('[data-sec-props="pageModal"]').forEach((ta) => {
              const idx = Number(ta.dataset.idx);
              localSections[idx].props = JSON.parse(ta.value || '{}');
            });
            const res = await api('api/page-sections', 'POST', {
              group,
              locale,
              hero: heroVal,
              container: containerVal,
              flushTop: flushTopVal,
              sections: localSections,
            });
            modal.classList.add('hidden');
            logConsole('page:sections', 'Saved ' + res.file, true);
            showToast('Saved ' + res.file + ' ✓');
            await loadState(true);
          } catch (err) {
            logConsole('page:sections', err.message, false);
            showToast(err.message);
          }
        }
      };
    }

    function syncWizardPreview() {
      const pre = document.getElementById('w-spec-pre');
      if (pre) pre.textContent = JSON.stringify(buildSiteSpecFromWizard(), null, 2);
    }

    document.addEventListener('click', async (e) => {
      const target = e.target instanceof HTMLElement ? e.target.closest('button, [data-tab]') : null;
      if (!target) return;

      if (target.id === 'btn-lang') {
        uiLang = uiLang === 'fa' ? 'en' : 'fa';
        localStorage.setItem('studio_lang', uiLang);
        renderChrome();
        renderActiveTab();
        return;
      }
      if (target.id === 'btn-theme') {
        const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        document.documentElement.dataset.theme = next;
        return;
      }
      if (target.id === 'btn-refresh') {
        await loadState(true);
        showToast('Refreshed');
        return;
      }
      if (target.id === 'console-clear') {
        e.stopPropagation();
        document.getElementById('console-pre').textContent = 'Cleared.';
        return;
      }
      if (target.dataset.tab) {
        activeTab = target.dataset.tab;
        localStorage.setItem('studio_tab', activeTab);
        renderChrome();
        renderActiveTab();
        return;
      }
      if (target.dataset.bp) {
        const key = target.dataset.bp;
        const bp = state.blueprints[key];
        wizardDraft.blueprint = key;
        if (bp) {
          wizardDraft.brand.preset = bp.preset;
          wizardDraft.brand.fontPreset = bp.fontPreset;
          wizardDraft.brand.rtlFontPreset = bp.rtlFontPreset;
          wizardDraft.brand.socialCardMode = bp.socialCardMode;
          wizardDraft.brand.primaryColor = '';
          wizardDraft.brand.accentColor = '';
        }
        renderActiveTab();
        return;
      }
      if (target.dataset.wPreset) {
        wizardDraft.brand.preset = target.dataset.wPreset;
        wizardDraft.brand.primaryColor = '';
        renderActiveTab();
        return;
      }
      if (target.dataset.secAdd) {
        const mode = target.dataset.secAdd;
        const sel = document.getElementById(target.dataset.select);
        const block = sel?.value;
        if (!block) return;
        const newItem = { block, props: JSON.parse(JSON.stringify(DEFAULT_BLOCK_PROPS[block] || {})) };
        if (mode === 'wizardHome') {
          wizardDraft.homeSections.push(newItem);
          renderActiveTab();
        } else {
          const modalState = document.getElementById('modal-root')._sectionsState;
          const arr = modalState.get();
          arr.push(newItem);
          modalState.set(arr);
        }
        return;
      }
      if (target.dataset.secAct) {
        const act = target.dataset.secAct;
        const idx = Number(target.dataset.idx);
        const mode = target.dataset.target;
        const arr = mode === 'wizardHome' ? wizardDraft.homeSections : document.getElementById('modal-root')._sectionsState.get();
        if (act === 'del') arr.splice(idx, 1);
        else if (act === 'up' && idx > 0) [arr[idx - 1], arr[idx]] = [arr[idx], arr[idx - 1]];
        else if (act === 'down' && idx < arr.length - 1) [arr[idx], arr[idx + 1]] = [arr[idx + 1], arr[idx]];
        if (mode === 'wizardHome') renderActiveTab();
        else document.getElementById('modal-root')._sectionsState.set(arr);
        return;
      }
      if (target.id === 'btn-w-copy-spec') {
        const text = JSON.stringify(buildSiteSpecFromWizard(), null, 2);
        await navigator.clipboard?.writeText(text).catch(() => {});
        showToast('Spec JSON copied ✓');
        return;
      }
      if (target.id === 'btn-w-dryrun' || target.id === 'btn-w-apply') {
        const dryRun = target.id === 'btn-w-dryrun';
        try {
          const spec = buildSiteSpecFromWizard();
          const res = await api('api/site-apply', 'POST', {
            spec,
            dryRun,
            skipAssets: wizardDraft.skipAssets,
          });
          logConsole(dryRun ? 'site:apply --dry-run' : 'site:apply', JSON.stringify(res, null, 2), true);
          showToast(dryRun ? 'Dry-run OK ✓' : 'Site provisioned ✓');
          if (!dryRun) await loadState(true);
        } catch (err) {
          logConsole('site:apply', err.output || err.message, false);
          showToast('Validation error');
        }
        return;
      }
      if (target.id === 'btn-cfg-save') {
        try {
          const navPages = JSON.parse(document.getElementById('cfg-nav-pages').value || '[]');
          const navFooter = JSON.parse(document.getElementById('cfg-nav-footer').value || '[]');
          const redirects = JSON.parse(document.getElementById('cfg-redirects').value || '[]');
          configDraft.ui = configDraft.ui || {};
          configDraft.ui.navigation = { pages: navPages, footerColumns: navFooter };
          configDraft.redirects = redirects;
          const res = await api('api/config-save', 'POST', { patch: configDraft });
          logConsole('config:save', JSON.stringify(res.clientOverrides, null, 2), true);
          showToast('Saved client/config.json ✓');
          await loadState(false);
        } catch (err) {
          logConsole('config:save', err.message, false);
          showToast(err.message);
        }
        return;
      }
      if (target.id === 'btn-cfg-reset') {
        if (pendingConfirmKey !== 'site:reset') {
          pendingConfirmKey = 'site:reset';
          target.textContent = uiLang === 'fa' ? 'تأیید بازنشانی؟ دوباره کلیک کنید' : 'Confirm reset? Click again';
          setTimeout(() => { pendingConfirmKey = ''; renderActiveTab(); }, 3000);
          return;
        }
        pendingConfirmKey = '';
        await runCli('site:reset', { cleanStarter: false }, 'site:reset');
        return;
      }
      if (target.dataset.toggleCt) {
        const [type, mode] = target.dataset.toggleCt.split(':');
        await runCli(mode === 'enable' ? 'content:enable' : 'content:disable', { type }, 'content:' + mode + ' ' + type);
        return;
      }
      if (target.dataset.editSections) {
        const [group, locale] = target.dataset.editSections.split(':');
        openPageSectionsModal(group, locale);
        return;
      }
      if (target.dataset.delPage) {
        const g = target.dataset.delPage;
        const ckey = 'del-page:' + g;
        if (pendingConfirmKey !== ckey) {
          pendingConfirmKey = ckey;
          target.textContent = '?';
          setTimeout(() => { pendingConfirmKey = ''; renderActiveTab(); }, 3000);
          return;
        }
        pendingConfirmKey = '';
        await runCli('remove:page', { group: g }, 'remove:page ' + g);
        return;
      }
      if (target.id === 'btn-new-page') {
        await runCli('new:page', {
          group: document.getElementById('np-group').value.trim(),
          title: document.getElementById('np-title').value.trim(),
          slug: document.getElementById('np-slug').value.trim(),
          preset: document.getElementById('np-preset').value,
          publish: document.getElementById('np-publish').checked,
        }, 'new:page');
        return;
      }
      if (target.id === 'btn-new-entry') {
        const type = document.getElementById('nc-type').value;
        const payload = {
          type,
          group: document.getElementById('nc-group').value.trim(),
          title: document.getElementById('nc-title').value.trim(),
          locale: document.getElementById('nc-locale').value,
          publish: document.getElementById('nc-publish').checked,
        };
        await runCli(type === 'blog' ? 'new:post' : 'content:new', payload, type + ':new');
        return;
      }
      if (target.dataset.setDef) {
        await runCli('i18n:set-default', { code: target.dataset.setDef, allowDraft: true }, 'i18n:set-default');
        return;
      }
      if (target.dataset.soloLoc) {
        await runCli('i18n:solo', { code: target.dataset.soloLoc, allowDraft: true }, 'i18n:solo');
        return;
      }
      if (target.dataset.remLoc) {
        await runCli('i18n:remove-lang', { code: target.dataset.remLoc }, 'i18n:remove-lang');
        return;
      }
      if (target.id === 'btn-add-lang') {
        await runCli('i18n:add-lang', {
          code: document.getElementById('al-code').value.trim(),
          dir: document.getElementById('al-dir').value,
          name: document.getElementById('al-name').value.trim(),
          fontFamily: document.getElementById('al-font').value.trim(),
        }, 'i18n:add-lang');
        return;
      }
      if (target.id === 'btn-sync-dry' || target.id === 'btn-sync-run') {
        await runCli('i18n:sync-keys', { dryRun: target.id === 'btn-sync-dry' }, 'i18n:sync-keys');
        return;
      }
      if (target.id === 'btn-add-key') {
        const translations = {};
        document.querySelectorAll('[data-ia-loc]').forEach((el) => {
          translations[el.dataset.iaLoc] = el.value;
        });
        await runCli('i18n:add', { key: document.getElementById('ia-key').value.trim(), translations }, 'i18n:add');
        return;
      }
      if (target.dataset.cli) {
        await runCli(target.dataset.cli, {}, target.dataset.cli);
        return;
      }
      if (target.dataset.toolAction) {
        const action = target.dataset.toolAction;
        if (target.dataset.confirm === '1' && pendingConfirmKey !== action) {
          pendingConfirmKey = action;
          target.textContent = 'Confirm?';
          setTimeout(() => { pendingConfirmKey = ''; renderActiveTab(); }, 3000);
          return;
        }
        pendingConfirmKey = '';
        const payload = JSON.parse(target.dataset.toolPayload || '{}');
        await runCli(action, payload, action);
        return;
      }
    });

    document.getElementById('console-toggle').addEventListener('click', () => {
      const body = document.getElementById('console-body');
      const chev = document.getElementById('console-chevron');
      const hidden = body.classList.toggle('hidden');
      chev.textContent = hidden ? '▲' : '▼';
    });

    document.addEventListener('input', (e) => {
      const el = e.target;
      if (!(el instanceof HTMLElement)) return;

      if (el.dataset.wSite) {
        wizardDraft.site[el.dataset.wSite] = el.value;
        syncWizardPreview();
      } else if (el.dataset.wBrand) {
        wizardDraft.brand[el.dataset.wBrand] = el.value;
        syncWizardPreview();
      } else if (el.id === 'w-default-locale') {
        wizardDraft.locale.defaultLocale = el.value;
        syncWizardPreview();
      } else if (el.dataset.wpField) {
        const [group, field] = el.dataset.wpField.split(':');
        wizardDraft.pageDrafts[group][field] = el.value;
        syncWizardPreview();
      } else if (el.dataset.secProps === 'wizardHome') {
        try {
          wizardDraft.homeSections[Number(el.dataset.idx)].props = JSON.parse(el.value || '{}');
          el.style.borderColor = '';
          syncWizardPreview();
        } catch {
          el.style.borderColor = 'var(--danger)';
        }
      } else if (el.dataset.cfg) {
        const parts = el.dataset.cfg.split('.');
        let cur = configDraft;
        for (let i = 0; i < parts.length - 1; i++) {
          cur[parts[i]] = cur[parts[i]] || {};
          cur = cur[parts[i]];
        }
        cur[parts[parts.length - 1]] = el.value;
      } else if (el.dataset.cfgNum) {
        const parts = el.dataset.cfgNum.split('.');
        let cur = configDraft;
        for (let i = 0; i < parts.length - 1; i++) {
          cur[parts[i]] = cur[parts[i]] || {};
          cur = cur[parts[i]];
        }
        cur[parts[parts.length - 1]] = Number(el.value);
      }
    });

    document.addEventListener('change', async (e) => {
      const el = e.target;
      if (!(el instanceof HTMLInputElement)) return;

      if (el.id === 'w-disable-banner') { wizardDraft.disableTopBanner = el.checked; syncWizardPreview(); }
      else if (el.id === 'w-skip-assets') { wizardDraft.skipAssets = el.checked; }
      else if (el.id === 'w-locale-solo') { wizardDraft.locale.solo = el.checked; syncWizardPreview(); }
      else if (el.dataset.wpToggle) { wizardDraft.selectedPages[el.dataset.wpToggle] = el.checked; renderActiveTab(); }
      else if (el.dataset.wpNav) { wizardDraft.pageDrafts[el.dataset.wpNav].nav = el.checked; syncWizardPreview(); }
      else if (el.dataset.wpPub) { wizardDraft.pageDrafts[el.dataset.wpPub].publish = el.checked; syncWizardPreview(); }
      else if (el.dataset.cfgBool) {
        const parts = el.dataset.cfgBool.split('.');
        let cur = configDraft;
        for (let i = 0; i < parts.length - 1; i++) {
          cur[parts[i]] = cur[parts[i]] || {};
          cur = cur[parts[i]];
        }
        cur[parts[parts.length - 1]] = el.checked;
      } else if (el.dataset.uploadLogo && el.files?.[0]) {
        const variant = el.dataset.uploadLogo;
        const reader = new FileReader();
        reader.onload = async () => {
          try {
            const res = await api('api/upload-logo', 'POST', { variant, dataUrl: reader.result });
            wizardDraft.brand.logo[variant] = res.publicPath;
            syncWizardPreview();
            showToast('Uploaded ' + res.publicPath + ' ✓');
          } catch (err) {
            showToast(err.message);
          }
        };
        reader.readAsDataURL(el.files[0]);
      }
    });

    loadState(true).catch((err) => logConsole('init', err.message, false));
  </script>
</body>
</html>
