# Pages CMS configuration (https://pagescms.org)
# Aligned with the 3-tier Astro v7 SSG content architecture (`<group>/<locale>.mdx`).

media:
  input: src/assets
  output: ../../assets

content:
  - name: pages
    label: Static Pages
    type: collection
    path: src/content/pages
    filename: "{primary}/{locale}.mdx"
    subfolders: true
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: URL Slug (leave empty only for home)
        type: string
      - name: description
        label: Meta Description
        type: string
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: hero
        label: Hero Variant
        type: select
        options:
          values: ["none", "minimal", "default"]
        default: "none"
      - name: container
        label: Page Container
        type: select
        options:
          values: ["canvas", "contained", "prose"]
        default: "canvas"
      - name: flushTop
        label: Flush Top (under sticky header)
        type: boolean
        default: false
      - name: template
        label: Bespoke Template Key
        type: string
      - name: image
        label: Hero Image
        type: image
      - name: body
        label: Body (MDX)
        type: rich-text

  - name: blog
    label: Blog Posts
    type: collection
    path: src/content/blog
    filename: "{primary}/{locale}.mdx"
    subfolders: true
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Localized Slug
        type: string
        required: true
      - name: description
        label: Summary
        type: string
      - name: author
        label: Author
        type: string
      - name: publishedAt
        label: Publish Date
        type: date
        required: true
      - name: updatedAt
        label: Updated Date
        type: date
      - name: categories
        label: Categories
        type: string
        list: true
      - name: tags
        label: Tags
        type: string
        list: true
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: image
        label: Cover Image
        type: image
      - name: body
        label: Content (MDX)
        type: rich-text

  - name: projects
    label: Projects & Case Studies
    type: collection
    path: src/content/projects
    filename: "{primary}/{locale}.mdx"
    subfolders: true
    format: yaml-frontmatter
    fields:
      - name: title
        label: Project Title
        type: string
        required: true
      - name: slug
        label: Localized Slug
        type: string
        required: true
      - name: description
        label: Summary
        type: string
      - name: client
        label: Client Name
        type: string
      - name: year
        label: Year
        type: number
      - name: link
        label: Live Project URL
        type: string
      - name: stack
        label: Technologies / Services
        type: string
        list: true
      - name: categories
        label: Categories
        type: string
        list: true
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: image
        label: Cover Image
        type: image
      - name: body
        label: Case Study (MDX)
        type: rich-text

  - name: settings
    label: Site Settings (Client CMS)
    type: file
    path: client/cms.json
    format: json
    fields:
      - name: business
        label: Business & Contact Details
        type: object
        fields:
          - name: legalName
            label: Legal Name
            type: string
          - name: phone
            label: Phone Number
            type: string
          - name: whatsapp
            label: WhatsApp (Phone or URL)
            type: string
          - name: telegram
            label: Telegram (@handle or URL)
            type: string
          - name: workingHours
            label: Working Hours
            type: string
          - name: address
            label: Street Address
            type: string
          - name: city
            label: City
            type: string
          - name: country
            label: Country
            type: string
          - name: mapEmbedUrl
            label: Map Embed URL (Optional)
            type: string
          - name: geo
            label: Map Coordinates (Geo)
            type: object
            fields:
              - name: lat
                label: Latitude
                type: number
              - name: lng
                label: Longitude
                type: number
      - name: social
        label: Social Profiles
        type: object
        fields:
          - name: github
            label: GitHub URL
            type: string
          - name: twitter
            label: X / Twitter URL
            type: string
          - name: linkedin
            label: LinkedIn URL
            type: string
          - name: instagram
            label: Instagram URL
            type: string
          - name: telegram
            label: Telegram Channel URL
            type: string
      - name: ui
        label: Announcements & UI
        type: object
        fields:
          - name: topBanner
            label: Top Announcement Banner
            type: object
            fields:
              - name: enabled
                label: Enable Top Banner
                type: boolean
                default: false
              - name: id
                label: Campaign ID
                type: string
                default: "site-announcement"
              - name: variant
                label: Visual Style
                type: select
                options:
                  values: ["primary", "hero", "surface", "accent", "info", "warning"]
                default: "primary"
              - name: badge
                label: Badge Label
                type: string
              - name: message
                label: Announcement Text
                type: string
              - name: ctaLabel
                label: Button Label
                type: string
              - name: ctaHref
                label: Button Link
                type: string
              - name: dismissible
                label: Allow Dismiss
                type: boolean
                default: true
              - name: dismissMode
                label: Dismiss Persistence
                type: select
                options:
                  values: ["session", "persistent"]
                default: "session"
              - name: dismissTtlDays
                label: Persistent Dismiss Days (1-365)
                type: number
              - name: dismissVersion
                label: Campaign Version
                type: number
                default: 1
              - name: startsAt
                label: Starts At (ISO Date/Time)
                type: string
              - name: endsAt
                label: Ends At (ISO Date/Time)
                type: string
      - name: redirects
        label: URL Redirects
        type: object
        list: true
        fields:
          - name: from
            label: Source Path (e.g. /old-page)
            type: string
            required: true
          - name: to
            label: Target Path or URL
            type: string
            required: true
          - name: status
            label: HTTP Status
            type: select
            options:
              values: [301, 302]
            default: 301

