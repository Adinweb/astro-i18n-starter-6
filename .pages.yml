# Pages CMS configuration (https://pagescms.org)
# Aligned with the 3-tier Astro v7 SSG content architecture (`<group>/<locale>.mdx`).

media:
  input: src/assets
  output: ../../assets

content:
  - name: pages
    label: Static Pages
    type: collection
    path: src/content/pages
    filename: "{primary}/{locale}.mdx"
    subfolders: true
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: URL Slug (leave empty only for home)
        type: string
      - name: description
        label: Meta Description
        type: string
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: hero
        label: Hero Variant
        type: select
        options:
          values: ["none", "minimal", "default"]
        default: "none"
      - name: container
        label: Page Container
        type: select
        options:
          values: ["canvas", "contained", "prose"]
        default: "canvas"
      - name: flushTop
        label: Flush Top (under sticky header)
        type: boolean
        default: false
      - name: template
        label: Bespoke Template Key
        type: string
      - name: image
        label: Hero Image
        type: image
      - name: body
        label: Body (MDX)
        type: rich-text

  - name: blog
    label: Blog Posts
    type: collection
    path: src/content/blog
    filename: "{primary}/{locale}.mdx"
    subfolders: true
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: slug
        label: Localized Slug
        type: string
        required: true
      - name: description
        label: Summary
        type: string
      - name: author
        label: Author
        type: string
      - name: publishedAt
        label: Publish Date
        type: date
        required: true
      - name: updatedAt
        label: Updated Date
        type: date
      - name: categories
        label: Categories
        type: string
        list: true
      - name: tags
        label: Tags
        type: string
        list: true
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: image
        label: Cover Image
        type: image
      - name: body
        label: Content (MDX)
        type: rich-text

  - name: projects
    label: Projects & Case Studies
    type: collection
    path: src/content/projects
    filename: "{primary}/{locale}.mdx"
    subfolders: true
    format: yaml-frontmatter
    fields:
      - name: title
        label: Project Title
        type: string
        required: true
      - name: slug
        label: Localized Slug
        type: string
        required: true
      - name: description
        label: Summary
        type: string
      - name: client
        label: Client Name
        type: string
      - name: year
        label: Year
        type: number
      - name: link
        label: Live Project URL
        type: string
      - name: stack
        label: Technologies / Services
        type: string
        list: true
      - name: categories
        label: Categories
        type: string
        list: true
      - name: draft
        label: Draft
        type: boolean
        default: false
      - name: image
        label: Cover Image
        type: image
      - name: body
        label: Case Study (MDX)
        type: rich-text
